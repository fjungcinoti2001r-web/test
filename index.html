<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>动作消除·进化排版测试</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; touch-action: none; }
        
        body, html {
            width: 100%; height: 100%; height: 100dvh;
            background-color: #2C1E16; /* 深色外围背景 */
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex; justify-content: center; align-items: center;
        }

        #app-container {
            width: 100%; max-width: 420px; height: 100%;
            background-color: #FFF8EA;
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }

        /* ================= 1. 顶部舞台区 ================= */
        #top-stage {
            height: 28%; width: 100%;
            background: linear-gradient(to bottom, #1A2A3A 0%, #3A4A5A 80%, #5C4033 100%);
            position: relative;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* 顶部两侧UI */
        .stage-ui-left, .stage-ui-right {
            position: absolute; top: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 12px; border-radius: 8px;
            border: 2px solid #DEB887;
            text-align: center; font-weight: 900;
        }
        .stage-ui-left { left: 10px; color: #8B5A2B; }
        .stage-ui-right { right: 10px; color: #D2691E; }
        .ui-label { font-size: 11px; }
        .ui-value { font-size: 18px; }

        /* 角色展示 */
        #character-avatar {
            font-size: 80px; /* 占位，后续换成 img */
            transition: all 0.3s ease;
            transform-origin: bottom center;
            margin-bottom: -10px; /* 让他站在吧台上 */
            z-index: 2;
        }
        #character-name {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            color: #FFD700; font-size: 16px; font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 12px;
            white-space: nowrap;
        }

        /* 吧台/桌子 */
        #desk {
            width: 100%; height: 35px;
            background: #8B5A2B;
            border-top: 4px solid #A0522D;
            border-bottom: 3px solid #5C4033;
            z-index: 3;
            display: flex; justify-content: center; align-items: flex-start;
        }
        #desk-prop { font-size: 24px; margin-top: -12px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* ================= 2. 中部消除盘面 ================= */
        #middle-board {
            flex: 1; width: 100%;
            background: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" fill="%23FFF5E1"/><rect width="20" height="20" fill="%23FAD6A5" fill-opacity="0.4"/><rect x="20" y="20" width="20" height="20" fill="%23FAD6A5" fill-opacity="0.4"/></svg>');
            display: flex; justify-content: center; align-items: center;
            padding: 10px; box-sizing: border-box;
            box-shadow: inset 0 0 20px rgba(139, 90, 43, 0.2);
        }

        #grid-container {
            position: relative;
            background: rgba(255, 255, 255, 0.5);
            border: 4px solid #DEB887; border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(92, 64, 51, 0.2);
        }

        /* 盘面底格 */
        .bg-cell {
            position: absolute;
            box-sizing: border-box;
            border: 1px solid rgba(222, 184, 135, 0.3);
        }
        .bg-cell.light { background-color: rgba(255, 248, 234, 0.7); }
        .bg-cell.dark { background-color: rgba(245, 222, 179, 0.7); }

        /* 可消除元素 */
        .tile {
            position: absolute;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; /* 占位，后续换成背景图 */
            transition: top 0.25s ease-in, left 0.2s ease-out;
            cursor: pointer;
            z-index: 10;
        }
        .tile.selected {
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px rgba(210, 105, 30, 0.8));
            z-index: 20;
        }
        .tile.matched {
            animation: popOut 0.3s forwards;
        }
        @keyframes popOut {
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* ================= 3. 底部道具区 ================= */
        #bottom-tools {
            height: 12%; width: 100%;
            background: #DEB887;
            border-top: 4px solid #CD853F;
            display: flex; justify-content: space-evenly; align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }
        .tool-btn {
            width: 50px; height: 50px;
            background: #FFF8EA; border: 3px solid #8B5A2B;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .tool-btn:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.2); }
        .tool-badge {
            position: absolute; top: -5px; right: -5px;
            background: #FF334B; color: white;
            font-size: 10px; font-weight: bold;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #FFF;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 1. 顶部舞台 -->
    <div id="top-stage">
        <div class="stage-ui-left">
            <div class="ui-label">关卡</div>
            <div class="ui-value">12</div>
        </div>
        <div class="stage-ui-right">
            <div class="ui-label">总战力</div>
            <div class="ui-value" id="score-display">0</div>
        </div>

        <div id="character-name">第一形态：初入江湖</div>
        <div id="character-avatar">👦</div>
        
        <div id="desk">
            <div id="desk-prop">☕</div>
        </div>
    </div>

    <!-- 2. 中部消除盘面 -->
    <div id="middle-board">
        <div id="grid-container"></div>
    </div>

    <!-- 3. 底部道具栏 -->
    <div id="bottom-tools">
        <div class="tool-btn">🔨<div class="tool-badge">2</div></div>
        <div class="tool-btn">💣<div class="tool-badge">1</div></div>
        <div class="tool-btn">🔄<div class="tool-badge">3</div></div>
        <div class="tool-btn">⚙️</div>
    </div>
</div>

<script>
    const ROWS = 8;
    const COLS = 8;
    let TILE_SIZE = 40; // 会根据屏幕宽度动态计算
    const TYPES = ['🥋', '🕶️', '🗡️', '👊', '🧨', '📿']; 
    
    // 角色进化配置数据表
    const EVOLUTION_STAGES = [
        { threshold: 0,    name: "第一形态：初入江湖", avatar: "👦", prop: "☕" },
        { threshold: 200,  name: "第二形态：东北警察", avatar: "👮", prop: "🚔" },
        { threshold: 500,  name: "第三形态：目中无人", avatar: "🦯", prop: "🍶" },
        { threshold: 1000, name: "终极形态：火遮眼",   avatar: "🔥", prop: "🩸" }
    ];

    let board = [];
    let domTiles = [];
    let score = 0;
    let selectedTile = null;
    let isAnimating = false;
    let currentStageIndex = 0;

    const gridContainer = document.getElementById('grid-container');
    const scoreDisplay = document.getElementById('score-display');
    const avatarDisplay = document.getElementById('character-avatar');
    const nameDisplay = document.getElementById('character-name');
    const propDisplay = document.getElementById('desk-prop');

    // 适配屏幕计算网格大小
    function initSize() {
        const boardWidth = document.getElementById('middle-board').clientWidth - 30;
        TILE_SIZE = Math.floor(boardWidth / COLS);
        gridContainer.style.width = `${TILE_SIZE * COLS}px`;
        gridContainer.style.height = `${TILE_SIZE * ROWS}px`;
    }

    // 初始化背景交替网格
    function createBackgroundGrid() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const bg = document.createElement('div');
                bg.className = `bg-cell ${(r + c) % 2 === 0 ? 'dark' : 'light'}`;
                bg.style.width = `${TILE_SIZE}px`;
                bg.style.height = `${TILE_SIZE}px`;
                bg.style.left = `${c * TILE_SIZE}px`;
                bg.style.top = `${r * TILE_SIZE}px`;
                gridContainer.appendChild(bg);
            }
        }
    }

    // 生成不含直接连通的初始盘面
    function initBoard() {
        for (let r = 0; r < ROWS; r++) {
            board[r] = [];
            domTiles[r] = [];
            for (let c = 0; c < COLS; c++) {
                let type;
                do {
                    type = TYPES[Math.floor(Math.random() * TYPES.length)];
                } while (
                    (c >= 2 && board[r][c-1] === type && board[r][c-2] === type) ||
                    (r >= 2 && board[r-1][c] === type && board[r-2][c] === type)
                );
                board[r][c] = type;
                createTileDOM(r, c, type);
            }
        }
    }

    function createTileDOM(r, c, type) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerText = type; // 后续这里可替换为 img
        tile.style.width = `${TILE_SIZE}px`;
        tile.style.height = `${TILE_SIZE}px`;
        tile.style.fontSize = `${TILE_SIZE * 0.7}px`;
        setTilePosition(tile, r, c);
        
        tile.dataset.r = r;
        tile.dataset.c = c;
        
        tile.addEventListener('pointerdown', () => handleTileClick(r, c));
        gridContainer.appendChild(tile);
        domTiles[r][c] = tile;
        return tile;
    }

    function setTilePosition(tile, r, c) {
        tile.style.top = `${r * TILE_SIZE}px`;
        tile.style.left = `${c * TILE_SIZE}px`;
        tile.dataset.r = r;
        tile.dataset.c = c;
    }

    // 处理点击与交换逻辑
    async function handleTileClick(r, c) {
        if (isAnimating) return;

        const tile = domTiles[r][c];
        
        if (!selectedTile) {
            selectedTile = { r, c, dom: tile };
            tile.classList.add('selected');
        } else {
            selectedTile.dom.classList.remove('selected');
            const isAdjacent = Math.abs(selectedTile.r - r) + Math.abs(selectedTile.c - c) === 1;
            
            if (isAdjacent) {
                isAnimating = true;
                // 视觉交换
                swapDOM(selectedTile.r, selectedTile.c, r, c);
                // 逻辑交换
                swapData(selectedTile.r, selectedTile.c, r, c);
                
                await sleep(250); // 等待 CSS 动画完成

                if (checkMatches().length > 0) {
                    await processMatches();
                } else {
                    // 没有匹配，换回来
                    swapDOM(selectedTile.r, selectedTile.c, r, c);
                    swapData(selectedTile.r, selectedTile.c, r, c);
                    await sleep(250);
                    isAnimating = false;
                }
            }
            selectedTile = null;
        }
    }

    function swapDOM(r1, c1, r2, c2) {
        const tile1 = domTiles[r1][c1];
        const tile2 = domTiles[r2][c2];
        setTilePosition(tile1, r2, c2);
        setTilePosition(tile2, r1, c1);
        domTiles[r1][c1] = tile2;
        domTiles[r2][c2] = tile1;
    }

    function swapData(r1, c1, r2, c2) {
        const temp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = temp;
    }

    function checkMatches() {
        let matchedSet = new Set();
        // 横向检测
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS - 2; c++) {
                if (board[r][c] && board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                    matchedSet.add(`${r},${c}`).add(`${r},${c+1}`).add(`${r},${c+2}`);
                }
            }
        }
        // 纵向检测
        for (let c = 0; c < COLS; c++) {
            for (let r = 0; r < ROWS - 2; r++) {
                if (board[r][c] && board[r+1][c] === board[r][c] && board[r+2][c] === board[r][c]) {
                    matchedSet.add(`${r},${c}`).add(`${r+1},${c}`).add(`${r+2},${c}`);
                }
            }
        }
        return Array.from(matchedSet).map(str => {
            const parts = str.split(',');
            return { r: parseInt(parts[0]), c: parseInt(parts[1]) };
        });
    }

    async function processMatches() {
        let matches;
        let comboMultiplier = 1;

        while ((matches = checkMatches()).length > 0) {
            // 1. 播放消除动画并加分
            matches.forEach(m => {
                const dom = domTiles[m.r][m.c];
                dom.classList.add('matched');
                board[m.r][m.c] = null;
                domTiles[m.r][m.c] = null;
            });
            
            updateScore(matches.length * 10 * comboMultiplier);
            await sleep(300); // 消除动画时间
            
            matches.forEach(m => {
                const oldDom = document.querySelector(`.tile.matched[data-r="${m.r}"][data-c="${m.c}"]`);
                if(oldDom) oldDom.remove();
            });

            // 2. 下落填补
            await applyGravity();
            comboMultiplier++;
        }
        isAnimating = false;
    }

    async function applyGravity() {
        for (let c = 0; c < COLS; c++) {
            let emptySpaces = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] === null) {
                    emptySpaces++;
                } else if (emptySpaces > 0) {
                    // 数据下移
                    board[r + emptySpaces][c] = board[r][c];
                    domTiles[r + emptySpaces][c] = domTiles[r][c];
                    board[r][c] = null;
                    domTiles[r][c] = null;
                    // DOM动画下移
                    setTilePosition(domTiles[r + emptySpaces][c], r + emptySpaces, c);
                }
            }
            // 3. 顶部生成新块下落
            for (let i = 0; i < emptySpaces; i++) {
                const type = TYPES[Math.floor(Math.random() * TYPES.length)];
                board[i][c] = type;
                const newTile = createTileDOM(i, c, type);
                // 制造从屏幕外掉落的视觉差
                newTile.style.top = `${(i - emptySpaces) * TILE_SIZE}px`; 
                // 强制重排以触发动画
                newTile.offsetHeight; 
                setTilePosition(newTile, i, c);
            }
        }
        await sleep(300); // 等待下落动画完成
    }

    // 更新分数并检测形态进化
    function updateScore(points) {
        score += points;
        scoreDisplay.innerText = score;
        
        // 检测是否达到下一个阶段
        if (currentStageIndex < EVOLUTION_STAGES.length - 1) {
            const nextStage = EVOLUTION_STAGES[currentStageIndex + 1];
            if (score >= nextStage.threshold) {
                currentStageIndex++;
                triggerEvolution(nextStage);
            }
        }
    }

    function triggerEvolution(stageData) {
        // 加点进化时的缩放弹跳特效
        avatarDisplay.style.transform = "scale(1.4) translateY(-10px)";
        setTimeout(() => {
            avatarDisplay.innerText = stageData.avatar;
            nameDisplay.innerText = stageData.name;
            propDisplay.innerText = stageData.prop;
            avatarDisplay.style.transform = "scale(1) translateY(0)";
        }, 150);
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 初始化启动
    initSize();
    createBackgroundGrid();
    initBoard();

    // 禁用默认滑动以防拖拽整个网页
    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
