<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>苗哥的衣橱·演员谢苗超话</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin: 0; padding: 0; touch-action: manipulation; }
        
        html, body {
            width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
            background-color: #FFF8EA; color: #5C4033; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(#FAD6A5 10%, transparent 11%); background-size: 24px 24px;
        }

        /* 初始页弹窗[cite: 12] */
        #intro-mask {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #FFF5E1 0%, #FFEFD5 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 99999; text-align: center; padding: 20px; transition: opacity 0.35s ease-out;
        }
        .intro-content {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            animation: introBounce 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes introBounce {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .intro-title-1 { font-size: 32px; font-weight: 900; color: #D2691E; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(210, 105, 30, 0.2); }
        .intro-title-2 {
            display: flex; align-items: center; gap: 8px; font-size: 14px; color: #8B5A2B; font-weight: bold;
            background: rgba(255, 255, 255, 0.8); padding: 5px 16px; border-radius: 30px; border: 2px solid #FAD6A5;
        }
        .logo-wrap {
            width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #DEB887;
            display: inline-flex; justify-content: center; align-items: center; background: #FF7043;
            overflow: hidden; flex-shrink: 0;
        }
        .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .badge-text { font-size: 14px; font-weight: 900; color: #FFF; line-height: 1; }
        .intro-title-3 { font-size: 11px; color: #CD853F; font-weight: bold; letter-spacing: 1px; background: rgba(255, 255, 255, 0.75); padding: 4px 14px; border-radius: 20px; border: 1px dashed #DEB887; }
        
        .intro-enter-btn {
            margin-top: 10px; padding: 10px 38px; background-color: #3CB371; color: white;
            font-size: 18px; font-weight: 900; border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 0 #2E8B57, 0 8px 16px rgba(60, 179, 113, 0.3); transition: transform 0.1s;
            animation: pulseBtn 1.8s infinite;
        }
        .intro-enter-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2E8B57; }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* 手机主容器[cite: 12] */
        #arcade-container {
            width: 100vw; max-width: 440px; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
            background-color: #FFFFFF; border-left: 2px solid #FAD6A5; border-right: 2px solid #FAD6A5;
            box-shadow: 0 0 25px rgba(200, 180, 160, 0.4); position: relative; overflow: hidden;
        }

        /* 顶部导航栏：确保 z-index 最高，绝对可点[cite: 12] */
        .top-bar {
            width: 100%; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
            background: #FFEFD5; border-bottom: 2px solid #DEB887; z-index: 50; flex-shrink: 0;
            position: relative;
        }
        .header-layout { display: flex; align-items: center; gap: 8px; z-index: 51; }
        .title-group h1 { font-size: 15px; color: #D2691E; font-weight: 900; margin: 0; line-height: 1.2; }
        .subtitle { font-size: 9px; color: #8B5A2B; font-weight: bold; }
        
        .icon-btn {
            width: 34px; height: 34px; background: #FFF; border: 2px solid #DEB887; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: pointer;
            box-shadow: 0 2px 0 #E2BA8B; transition: transform 0.1s; flex-shrink: 0; position: relative; z-index: 52;
        }
        .icon-btn:active { transform: translateY(2px); box-shadow: none; }

        /* 模特主舞台[cite: 12] */
        #top-stage {
            height: 44%; min-height: 230px; width: 100%; position: relative; z-index: 10; flex-shrink: 0;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            background-color: #FFFDF9; border-bottom: 3px solid #DEB887; overflow: hidden;
        }
        #stage-bg-canvas { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; opacity: 0.55; pointer-events: none; }

        /* 模特立绘容器：严禁事件穿透拦截 */
        #model-display {
            position: relative; width: 220px; height: 256px; z-index: 2; margin-bottom: -4px;
            display: flex; justify-content: center; align-items: flex-end;
            pointer-events: none;
        }
        .model-layer {
            position: absolute; width: 100%; height: 100%; bottom: 0; left: 0;
            pointer-events: none;
        }
        .layer-sub-item {
            position: absolute; width: 100%; height: 100%; bottom: 0; left: 0;
            display: flex; justify-content: center; align-items: flex-end;
            pointer-events: none;
        }
        .model-layer img, .layer-sub-item img {
            width: 100%; height: 100%; object-fit: contain; display: block;
        }
        .model-layer svg, .layer-sub-item svg {
            width: 100%; height: 100%;
        }

        /* 桌面[cite: 12] */
        #desk {
            width: 100%; height: 26px; z-index: 5; display: flex; justify-content: center; align-items: flex-start;
            background: linear-gradient(180deg, #E6C291 0%, #D4A86C 100%); border-top: 3px solid #CD853F; border-bottom: 2px solid #5C4033;
            pointer-events: none;
        }

        /* 下部双层菜单区域[cite: 13] */
        #wardrobe-wrapper {
            flex: 1; display: flex; flex-direction: column; background: #FFFDF9; position: relative; overflow: hidden; z-index: 15;
        }

        /* 第一层大模式菜单 */
        .mode-tabs {
            display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px 4px 10px;
            background: #FFFDF9; flex-shrink: 0;
        }
        .mode-btn {
            flex: 1; padding: 7px 4px; border-radius: 10px; font-size: 13px; font-weight: 900;
            border: 2px solid #DEB887; background: #FFF5E1; color: #8B5A2B; cursor: pointer;
            text-align: center; white-space: nowrap; box-shadow: 0 2px 0 #DEB887; transition: all 0.15s;
        }
        .mode-btn.active-scatter {
            background: #3CB371; border-color: #2E8B57; color: #FFF; box-shadow: 0 2px 0 #1E6B37;
        }
        .mode-btn.active-archive {
            background: #FF6B81; border-color: #E84158; color: #FFF; box-shadow: 0 2px 0 #C23646;
        }

        /* 第二层胶囊分类标签[cite: 13] */
        .part-pills {
            display: flex; flex-wrap: wrap; gap: 5px 6px; padding: 6px 10px;
            background: #FFFDF9; border-bottom: 1.5px solid #F0E0CE; flex-shrink: 0;
            justify-content: flex-start;
        }
        .pill-btn {
            padding: 3px 10px; border-radius: 16px; font-size: 11px; font-weight: 900;
            border: 1.5px solid #DEB887; background: #FFF; color: #8B5A2B; cursor: pointer; white-space: nowrap;
        }
        .pill-btn.active {
            background: #FF7F00; border-color: #CC6600; color: #FFF;
        }

        /* 竖向长方形大卡片橱窗网格[cite: 13] */
        .cards-scroll-container {
            flex: 1; padding: 10px; overflow-x: auto; overflow-y: hidden;
            display: flex; gap: 10px; scrollbar-width: none; align-items: stretch;
            -webkit-overflow-scrolling: touch;
        }
        .cards-scroll-container::-webkit-scrollbar { display: none; }
        
        .tall-card {
            width: 84px; flex-shrink: 0; background: #FFF; border: 2px solid #EADBCE; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; padding: 6px 4px; box-shadow: 0 3px 0 #E2BA8B; transition: transform 0.1s, border-color 0.15s;
            position: relative;
        }
        .tall-card:active { transform: translateY(2px); box-shadow: none; }
        .tall-card.selected {
            border: 2.5px solid #FF5500; background: #FFF7ED; box-shadow: 0 3px 0 #FF5500;
        }

        .card-icon {
            width: 62px; height: 74px; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .card-icon img { width: 100%; height: 100%; object-fit: contain; }
        .card-icon svg { width: 100%; height: 100%; }

        .mini-model-thumb {
            width: 100%; height: 100%; position: relative;
            display: flex; justify-content: center; align-items: flex-end;
            pointer-events: none;
        }
        .mini-model-thumb .mini-layer {
            position: absolute; width: 100%; height: 100%; bottom: 0; left: 0;
            display: flex; justify-content: center; align-items: flex-end;
        }
        .mini-model-thumb .mini-layer img {
            width: 100%; height: 100%; object-fit: contain; display: block;
        }
        .mini-model-thumb svg {
            width: 100%; height: 100%;
        }

        .card-archive-title {
            font-size: 11px; font-weight: 900; color: #8B5A2B; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 74px; margin-top: 3px;
        }

        /* 快捷底栏[cite: 13] */
        #bottom-tools {
            padding: 6px 12px; background: #FFEFD5; border-top: 2px solid #DEB887;
            display: flex; justify-content: space-around; align-items: center; flex-shrink: 0;
            padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
        }
        .tool-btn {
            padding: 7px 22px; border-radius: 20px; font-size: 13px; font-weight: 900; color: white;
            border: none; cursor: pointer; display: flex; align-items: center; gap: 4px;
        }
        .btn-random { background: #4169E1; box-shadow: 0 3px 0 #27408B; }
        .btn-reset { background: #9370DB; box-shadow: 0 3px 0 #6A5ACD; }
        .btn-random:active, .btn-reset:active { transform: translateY(2px); box-shadow: none; }

        /* 触屏火花[cite: 13] */
        .touch-sparkle {
            position: fixed; pointer-events: none; z-index: 999999;
            width: 14px; height: 14px; border-radius: 50%;
            background: radial-gradient(circle, #FFD700 0%, #FF8C00 100%);
            box-shadow: 0 0 6px #FFD700;
            transform: translate(-50%, -50%);
            animation: sparklePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes sparklePop {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); }
        }

        /* 拍立得写真弹窗[cite: 13] */
        #poster-mask {
            display: none; position: fixed; inset: 0;
            background: rgba(40, 20, 10, 0.75); backdrop-filter: blur(4px); z-index: 100000;
            flex-direction: column; justify-content: center; align-items: center; padding: 16px;
        }

        /* 拍立得真实渲染图片容器 (1:1 正方形)[cite: 13] */
        #final-photo-img {
            width: 82vw;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            height: auto;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            display: block;
            background: #FFF5E1;
            user-select: auto !important;
            -webkit-user-select: auto !important;
            -webkit-touch-callout: default !important;
            touch-action: auto !important;
            cursor: pointer;
        }

        /* 昵称输入区[cite: 13] */
        .user-id-wrapper {
            margin-top: 10px; display: flex; align-items: center; gap: 6px;
            background: #FFF5E1; padding: 4px 6px 4px 10px; border-radius: 20px; border: 1.5px solid #DEB887;
        }
        .user-id-wrapper span { font-size: 12px; font-weight: 900; color: #8B5A2B; }
        .user-id-input {
            width: 90px; border: none; background: #FFF; outline: none; font-size: 12px; font-weight: bold;
            color: #D2691E; padding: 3px 6px; border-radius: 10px; text-align: center; border: 1.5px solid #FAD6A5;
        }
        .btn-confirm-id {
            padding: 4px 12px; background-color: #3CB371; border: none; border-radius: 12px;
            font-size: 12px; font-weight: 900; color: white; cursor: pointer; box-shadow: 0 2px 0 #2E8B57;
        }
        .btn-confirm-id:active { transform: translateY(1px); box-shadow: none; }
        
        .btn-close-poster {
            margin-top: 10px; padding: 7px 34px; background-color: #3CB371; border: none; border-radius: 25px;
            font-size: 14px; font-weight: 900; color: white; box-shadow: 0 4px 0 #2E8B57; cursor: pointer;
        }
        .btn-close-poster:active { transform: translateY(2px); box-shadow: none; }

        /* 命名私服弹窗 */
        #archive-name-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); z-index: 200000;
            justify-content: center; align-items: center;
        }
        .name-modal-box {
            background: #FFF5E1; border: 3px solid #FAD6A5; border-radius: 20px;
            padding: 16px 20px; width: 80%; max-width: 280px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .name-modal-title { font-size: 15px; font-weight: 900; color: #D2691E; margin-bottom: 10px; }
        .name-modal-input {
            width: 100%; padding: 6px 10px; border-radius: 10px; border: 2px solid #DEB887;
            font-size: 13px; font-weight: bold; color: #5C4033; text-align: center; outline: none; background: #FFF;
        }
        .name-modal-btns {
            display: flex; gap: 10px; justify-content: center; margin-top: 12px;
        }
        .name-btn {
            padding: 6px 18px; border-radius: 15px; font-size: 12px; font-weight: 900; border: none; cursor: pointer;
        }
        .name-btn-ok { background: #3CB371; color: white; box-shadow: 0 2px 0 #2E8B57; }
        .name-btn-cancel { background: #E2BA8B; color: #5C4033; }

        #hidden-canvas { display: none; }

        #toast {
            position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(210, 105, 30, 0.95);
            color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; z-index: 999999;
            opacity: 0; pointer-events: none; transition: opacity 0.25s; box-shadow: 0 3px 8px rgba(0,0,0,0.2); white-space: nowrap;
        }
    </style>
</head>
<body>

<audio id="bgm-audio" src="audio/bgm.mp3" loop preload="auto"></audio>

<div id="toast">提示信息</div>

<!-- 初始进入界面[cite: 13] -->
<div id="intro-mask">
    <div class="intro-content">
        <div class="intro-title-1">苗哥的衣橱</div>
        <div class="intro-title-2">
            <div class="logo-wrap">
                <img src="images/avatar-logo.png" alt="" onerror="handleLogoFallback(this)">
            </div>
            <span>演员谢苗超话</span>
        </div>
        <div class="intro-title-3">制作：林科森 | 制图：左海</div>
        <button class="intro-enter-btn" id="enter-game-btn">点击进入</button>
    </div>
</div>

<div id="arcade-container">
    <div class="top-bar">
        <div class="header-layout">
            <div class="logo-wrap">
                <img src="images/avatar-logo.png" alt="" onerror="handleLogoFallback(this)">
            </div>
            <div class="title-group">
                <h1>苗哥的衣橱</h1>
                <div class="subtitle">演员谢苗超话</div>
            </div>
        </div>
        <div class="header-layout">
            <div id="bgm-toggle" class="icon-btn" title="音乐开关">🎵</div>
            <div id="camera-toggle" class="icon-btn" style="background:#FFE4E1; border-color:#FFB6C1;" title="拍立得写真">📸</div>
        </div>
    </div>

    <!-- 模特展示舞台[cite: 14] -->
    <div id="top-stage">
        <canvas id="stage-bg-canvas"></canvas>
        <div id="model-display">
            <!-- 严谨层级顺序：素体 -> 妆容 -> 下装 -> 鞋袜 -> 上装 -> 五官 -> 发型 -> 头饰多层 -> 配饰多层 -->
            <div class="model-layer" id="layer-body"></div>
            <div class="model-layer" id="layer-maker"></div>
            <div class="model-layer" id="layer-pants"></div>
            <div class="model-layer" id="layer-shoes"></div>
            <div class="model-layer" id="layer-top"></div>
            <div class="model-layer" id="layer-face"></div>
            <div class="model-layer" id="layer-hair"></div>
            <div class="model-layer" id="layer-headwear"></div>
            <div class="model-layer" id="layer-accessory"></div>
        </div>
        <div id="desk"></div>
    </div>

    <!-- 双层菜单区[cite: 13] -->
    <div id="wardrobe-wrapper">
        <div class="mode-tabs">
            <div class="mode-btn active-scatter" id="btn-mode-scatter" onclick="switchMainMode('scatter')">散件搭配</div>
            <div class="mode-btn" id="btn-mode-archive" onclick="switchMainMode('archive')">私服存档位</div>
        </div>

        <div class="part-pills" id="part-pills"></div>
        <div class="cards-scroll-container" id="cards-container"></div>

        <div id="bottom-tools">
            <button class="tool-btn btn-random" onclick="randomizeOutfit()">随机搭配</button>
            <button class="tool-btn btn-reset" onclick="resetOutfit()">恢复经典</button>
        </div>
    </div>
</div>

<!-- 拍立得写真弹窗[cite: 13] -->
<div id="poster-mask">
    <img id="final-photo-img" alt="苗哥的衣橱写真" src="" />
    
    <div class="user-id-wrapper">
        <span>署名ID：</span>
        <input type="text" id="nickname-input" class="user-id-input" maxlength="8" value="林科森" placeholder="输入ID" />
        <button class="btn-confirm-id" onclick="updatePhotoWithID()">确认</button>
    </div>
    <button class="btn-close-poster" onclick="closePoster()">返回衣橱</button>
</div>

<!-- 自定义私服名称弹窗 -->
<div id="archive-name-modal">
    <div class="name-modal-box">
        <div class="name-modal-title">保存当前穿搭</div>
        <input type="text" id="custom-archive-name" class="name-modal-input" maxlength="6" placeholder="输入这套穿搭的名字" />
        <div class="name-modal-btns">
            <button class="name-btn name-btn-cancel" onclick="closeArchiveModal()">取消</button>
            <button class="name-btn name-btn-ok" onclick="confirmSaveArchive()">存入</button>
        </div>
    </div>
</div>

<canvas id="hidden-canvas" width="720" height="720"></canvas>

<script>
    function handleLogoFallback(img) {
        img.style.display = 'none';
        const parent = img.parentElement;
        if (!parent.querySelector('.badge-text')) {
            const span = document.createElement('span');
            span.className = 'badge-text';
            span.innerText = '苗';
            parent.appendChild(span);
        }
    }

    const WARDROBE_PARTS = {
        body: [
            { id: 'body_base_01', img: 'images/body/body_base_01.png', svg: `<circle cx="110" cy="90" r="32" fill="#FBD5B5"/><rect x="102" y="112" width="16" height="18" fill="#E8BD96"/><path d="M80,126 Q110,130 140,126 L150,195 L70,195 Z" fill="#FBD5B5"/>` },
            { id: 'body_base_02', img: 'images/body/body_base_02.png', svg: `<circle cx="110" cy="90" r="32" fill="#F5CBA7"/><rect x="102" y="112" width="16" height="18" fill="#DC9F72"/><path d="M80,126 Q110,130 140,126 L150,195 L70,195 Z" fill="#F5CBA7"/>` },
            { id: 'body_base_03', img: 'images/body/body_base_03.png', svg: `<circle cx="110" cy="90" r="32" fill="#E2AC7E"/><rect x="102" y="112" width="16" height="18" fill="#C99061"/><path d="M80,126 Q110,130 140,126 L150,195 L70,195 Z" fill="#E2AC7E"/>` },
            { id: 'body_base_04', img: 'images/body/body_base_04.png', svg: `<circle cx="110" cy="90" r="32" fill="#C68A58"/><rect x="102" y="112" width="16" height="18" fill="#A86F3F"/><path d="M80,126 Q110,130 140,126 L150,195 L70,195 Z" fill="#C68A58"/>` },
            { id: 'body_base_05', img: 'images/body/body_base_05.png', svg: `<circle cx="110" cy="90" r="32" fill="#FFE0BD"/><rect x="102" y="112" width="16" height="18" fill="#EBC49D"/><path d="M80,126 Q110,130 140,126 L150,195 L70,195 Z" fill="#FFE0BD"/>` }
        ],
        face: [
            { id: 'face_01', img: 'images/face/face_01.png', svg: `<circle cx="95" cy="88" r="4" fill="#333"/><circle cx="125" cy="88" r="4" fill="#333"/><path d="M102,104 Q110,112 118,104" stroke="#D2691E" stroke-width="2.5" fill="none"/>` },
            { id: 'face_02', img: 'images/face/face_02.png', svg: `<line x1="88" y1="80" x2="102" y2="85" stroke="#333" stroke-width="2.5"/><line x1="132" y1="80" x2="118" y2="85" stroke="#333" stroke-width="2.5"/><circle cx="95" cy="90" r="3.5" fill="#333"/><circle cx="125" cy="90" r="3.5" fill="#333"/><line x1="104" y1="106" x2="116" y2="106" stroke="#C85A17" stroke-width="2.5"/>` },

    const DEFAULT_DRESS = {
        body: 'body_base_01',
        face: 'face_01',
        maker: 'maker_none',
        hair: 'hair_01',
        top: 'top_01',
        headwear: ['headwear_01'],
        pants: 'pants_01',
        shoes: 'shoes_01',
        accessory: []
    };

    let currentDress = { ...DEFAULT_DRESS, headwear: ['headwear_01'], accessory: [] };

    let mainMode = 'scatter'; 
    let activePart = 'body';
    let bgmEnabled = true;
    let savingSlotIndex = -1;

    const partLabels = [
        { key: 'body', label: '素体' },
        { key: 'maker', label: '妆容' },
        { key: 'hair', label: '发型' },
        { key: 'face', label: '五官' },
        { key: 'top', label: '上装' },
        { key: 'pants', label: '下装' },
        { key: 'shoes', label: '鞋袜' },
        { key: 'headwear', label: '头饰' },
        { key: 'accessory', label: '配饰' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('enter-game-btn').addEventListener('click', enterGame);
        document.getElementById('intro-mask').addEventListener('click', enterGame);
        initStageCanvas();
        renderPartPills();
        renderCardsView();
        updateModelDisplay();

        window.addEventListener('pointerdown', spawnTouchSparkle, { passive: true });

        const bgmAudio = document.getElementById('bgm-audio');
        const bgmBtn = document.getElementById('bgm-toggle');
        bgmBtn.addEventListener('click', () => {
            bgmEnabled = !bgmEnabled;
            if (bgmEnabled) {
                bgmAudio.play().catch(()=>{});
                bgmBtn.innerText = '🎵';
                showToast('背景音乐已开启');
            } else {
                bgmAudio.pause();
                bgmBtn.innerText = '🔇';
                showToast('背景音乐已静音');
            }
            playCuteSound('pop');
        });

        document.getElementById('camera-toggle').addEventListener('click', openPolaroidPoster);
    });

    function enterGame(e) {
        if (e) e.stopPropagation();
        playCuteSound('enter');
        
        const bgm = document.getElementById('bgm-audio');
        if (bgm && bgmEnabled) {
            bgm.play().catch(()=>{});
        }

        const mask = document.getElementById('intro-mask');
        mask.style.opacity = '0';
        setTimeout(() => mask.style.display = 'none', 350);
        showToast('欢迎来到苗哥的衣橱');
    }

    function initStageCanvas() {
        const cvs = document.getElementById('stage-bg-canvas');
        const ctx = cvs.getContext('2d');
        cvs.width = 440;
        cvs.height = 320;
        ctx.fillStyle = '#FFF5E1';
        ctx.fillRect(0, 0, cvs.width, cvs.height);
        ctx.strokeStyle = '#FAD6A5';
        ctx.lineWidth = 1.5;
        for (let x = 0; x < cvs.width; x += 22) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cvs.height); ctx.stroke();
        }
        for (let y = 0; y < cvs.height; y += 22) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cvs.width, y); ctx.stroke();
        }
    }

    function spawnTouchSparkle(e) {
        const star = document.createElement('div');
        star.className = 'touch-sparkle';
        const x = e.clientX || (e.touches && e.touches[0].clientX);
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        star.style.left = `${x}px`;
        star.style.top = `${y}px`;
        star.style.setProperty('--dx', `${(Math.random() - 0.5) * 50}px`);
        star.style.setProperty('--dy', `${-20 - Math.random() * 40}px`);
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 500);
    }

    function switchMainMode(mode) {
        mainMode = mode;
        playCuteSound('tap');
        document.getElementById('btn-mode-scatter').className = `mode-btn ${mode === 'scatter' ? 'active-scatter' : ''}`;
        document.getElementById('btn-mode-archive').className = `mode-btn ${mode === 'archive' ? 'active-archive' : ''}`;

        const pillsWrap = document.getElementById('part-pills');
        pillsWrap.style.display = (mode === 'scatter') ? 'flex' : 'none';

        renderCardsView();
    }

    function renderPartPills() {
        const wrap = document.getElementById('part-pills');
        wrap.innerHTML = '';
        partLabels.forEach(p => {
            const pill = document.createElement('div');
            pill.className = `pill-btn ${p.key === activePart ? 'active' : ''}`;
            pill.innerText = p.label;
            pill.onclick = () => {
                activePart = p.key;
                playCuteSound('tap');
                renderPartPills();
                renderCardsView();
            };
            wrap.appendChild(pill);
        });
    }

    function renderCardIconContent(item) {
        if (!item || item.isNone) {
            return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="#DEB887" stroke-width="2" fill="none" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9" stroke-dasharray="3,3"></circle>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>`;
        }
        if (item.img) {
            return `<img src="${item.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" width="100%" height="100%" style="display:none;">${item.svg}</svg>`;
        }
        return `<svg viewBox="0 0 220 260" width="100%" height="100%">${item.svg || ''}</svg>`;
    }

    function renderArchiveThumbnail(dress) {
        const getObj = (list, id) => list.find(it => it.id === id);
        const body = getObj(WARDROBE_PARTS.body, dress.body);
        const maker = getObj(WARDROBE_PARTS.maker, dress.maker);
        const pants = getObj(WARDROBE_PARTS.pants, dress.pants);
        const shoes = getObj(WARDROBE_PARTS.shoes, dress.shoes);
        const top = getObj(WARDROBE_PARTS.top, dress.top);
        const face = getObj(WARDROBE_PARTS.face, dress.face);
        const hair = getObj(WARDROBE_PARTS.hair, dress.hair);

        function layerHtml(obj) {
            if (!obj || obj.isNone) return '';
            if (obj.img) {
                return `<img src="${obj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" width="100%" height="100%" style="display:none;">${obj.svg}</svg>`;
            }
            return `<svg viewBox="0 0 220 260" width="100%" height="100%">${obj.svg}</svg>`;
        }

        const headArray = Array.isArray(dress.headwear) ? dress.headwear : (dress.headwear ? [dress.headwear] : []);
        let headLayersHtml = '';
        headArray.forEach(hId => {
            const hObj = getObj(WARDROBE_PARTS.headwear, hId);
            if (hObj && !hObj.isNone) {
                headLayersHtml += `<div class="mini-layer">${layerHtml(hObj)}</div>`;
            }
        });

        const accArray = Array.isArray(dress.accessory) ? dress.accessory : (dress.accessory ? [dress.accessory] : []);
        let accLayersHtml = '';
        accArray.forEach(accId => {
            const accObj = getObj(WARDROBE_PARTS.accessory, accId);
            if (accObj && !accObj.isNone) {
                accLayersHtml += `<div class="mini-layer">${layerHtml(accObj)}</div>`;
            }
        });

        return `
            <div class="mini-model-thumb">
                <div class="mini-layer">${layerHtml(body)}</div>
                <div class="mini-layer">${layerHtml(maker)}</div>
                <div class="mini-layer">${layerHtml(pants)}</div>
                <div class="mini-layer">${layerHtml(shoes)}</div>
                <div class="mini-layer">${layerHtml(top)}</div>
                <div class="mini-layer">${layerHtml(face)}</div>
                <div class="mini-layer">${layerHtml(hair)}</div>
                ${headLayersHtml}
                ${accLayersHtml}
            </div>
        `;
    }

    function renderCardsView() {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        if (mainMode === 'scatter') {
            const items = WARDROBE_PARTS[activePart] || [];
            items.forEach(item => {
                const card = document.createElement('div');
                
                let isSel = false;
                if (activePart === 'headwear') {
                    if (item.isNone) {
                        isSel = !currentDress.headwear || currentDress.headwear.length === 0;
                    } else {
                        isSel = currentDress.headwear && currentDress.headwear.includes(item.id);
                    }
                } else if (activePart === 'accessory') {
                    if (item.isNone) {
                        isSel = !currentDress.accessory || currentDress.accessory.length === 0;
                    } else {
                        isSel = currentDress.accessory && currentDress.accessory.includes(item.id);
                    }
                } else {
                    isSel = currentDress[activePart] === item.id;
                }

                card.className = `tall-card ${isSel ? 'selected' : ''}`;
                card.innerHTML = `<div class="card-icon">${renderCardIconContent(item)}</div>`;
                
                card.onclick = () => {
                    playCuteSound('dress');
                    if (activePart === 'headwear') {
                        if (item.isNone) {
                            currentDress.headwear = [];
                            showToast('已脱下所有头饰');
                        } else {
                            if (!Array.isArray(currentDress.headwear)) currentDress.headwear = [];
                            const idx = currentDress.headwear.indexOf(item.id);
                            if (idx > -1) {
                                currentDress.headwear.splice(idx, 1);
                                showToast('已取下该头饰');
                            } else {
                                currentDress.headwear.push(item.id);
                                showToast('头饰已叠戴上身');
                            }
                        }
                    } else if (activePart === 'accessory') {
                        if (item.isNone) {
                            currentDress.accessory = [];
                            showToast('已卸除所有配饰');
                        } else {
                            if (!Array.isArray(currentDress.accessory)) currentDress.accessory = [];
                            const idx = currentDress.accessory.indexOf(item.id);
                            if (idx > -1) {
                                currentDress.accessory.splice(idx, 1);
                                showToast('已卸下该配饰');
                            } else {
                                currentDress.accessory.push(item.id);
                                showToast('配饰已叠穿上身');
                            }
                        }
                    } else {
                        currentDress[activePart] = item.id;
                    }
                    updateModelDisplay();
                    renderCardsView();
                };
                container.appendChild(card);
            });
        } else if (mainMode === 'archive') {
            const saves = JSON.parse(localStorage.getItem('miao_closet_saves_v6') || '[null,null,null,null,null]');
            for (let i = 0; i < 5; i++) {
                const card = document.createElement('div');
                const saveItem = saves[i];
                const hasSave = saveItem !== null && saveItem.dress !== undefined;
                card.className = `tall-card ${hasSave ? 'selected' : ''}`;
                
                if (hasSave) {
                    card.innerHTML = `
                        <div class="card-icon">${renderArchiveThumbnail(saveItem.dress)}</div>
                        <div class="card-archive-title">${saveItem.name || ('私服' + (i+1))}</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="card-icon" style="border: 2px dashed #E2BA8B; border-radius: 12px; width: 50px; height: 60px;">
                            <svg viewBox="0 0 24 24" width="22" height="22" stroke="#DEB887" stroke-width="2.5" fill="none" stroke-linecap="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </div>
                        <div class="card-archive-title" style="color:#B89065;">槽位 ${i+1}</div>
                    `;
                }

                card.onclick = () => {
                    if (hasSave) {
                        playCuteSound('dress');
                        currentDress = JSON.parse(JSON.stringify(saveItem.dress));
                        if (!Array.isArray(currentDress.headwear)) currentDress.headwear = [];
                        if (!Array.isArray(currentDress.accessory)) currentDress.accessory = [];
                        updateModelDisplay();
                        showToast(`已换上：${saveItem.name}`);
                    } else {
                        playCuteSound('tap');
                        savingSlotIndex = i;
                        document.getElementById('custom-archive-name').value = `私服${i + 1}`;
                        document.getElementById('archive-name-modal').style.display = 'flex';
                    }
                };
                container.appendChild(card);
            }
        }
    }

    function confirmSaveArchive() {
        if (savingSlotIndex < 0) return;
        playCuteSound('fanfare');
        const inputName = document.getElementById('custom-archive-name').value.trim() || `私服${savingSlotIndex + 1}`;
        const saves = JSON.parse(localStorage.getItem('miao_closet_saves_v6') || '[null,null,null,null,null]');
        
        saves[savingSlotIndex] = {
            name: inputName,
            dress: JSON.parse(JSON.stringify(currentDress))
        };
        localStorage.setItem('miao_closet_saves_v6', JSON.stringify(saves));
        
        closeArchiveModal();
        renderCardsView();
        showToast(`已存入【${inputName}】！`);
    }

    function closeArchiveModal() {
        savingSlotIndex = -1;
        document.getElementById('archive-name-modal').style.display = 'none';
    }

    function updateModelDisplay() {
        const getObj = (list, id) => list.find(it => it.id === id);

        // 素体
        const bodyObj = getObj(WARDROBE_PARTS.body, currentDress.body);
        document.getElementById('layer-body').innerHTML = bodyObj ? `<img src="${bodyObj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" style="display:none;">${bodyObj.svg}</svg>` : '';

        // 妆容
        const makerObj = getObj(WARDROBE_PARTS.maker, currentDress.maker);
        document.getElementById('layer-maker').innerHTML = (makerObj && !makerObj.isNone) ? `<img src="${makerObj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" style="display:none;">${makerObj.svg}</svg>` : '';

        // 下装
        const pantsObj = getObj(WARDROBE_PARTS.pants, currentDress.pants);
        document.getElementById('layer-pants').innerHTML = (pantsObj && !pantsObj.isNone) ? `<img src="${pantsObj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" style="display:none;">${pantsObj.svg}</svg>` : '';

        // 鞋袜
        const shoesObj = getObj(WARDROBE_PARTS.shoes, currentDress.shoes);
        document.getElementById('layer-shoes').innerHTML = (shoesObj && !shoesObj.isNone) ? `<img src="${shoesObj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" style="display:none;">${shoesObj.svg}</svg>` : '';

        // 上装
        const topObj = getObj(WARDROBE_PARTS.top, currentDress.top);
        document.getElementById('layer-top').innerHTML = (topObj && !topObj.isNone) ? `<img src="${topObj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" style="display:none;">${topObj.svg}</svg>` : '';

        // 五官
        const faceObj = getObj(WARDROBE_PARTS.face, currentDress.face);
        document.getElementById('layer-face').innerHTML = faceObj ? `<img src="${faceObj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" style="display:none;">${faceObj.svg}</svg>` : '';

        // 发型
        const hairObj = getObj(WARDROBE_PARTS.hair, currentDress.hair);
        document.getElementById('layer-hair').innerHTML = (hairObj && !hairObj.isNone) ? `<img src="${hairObj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" style="display:none;">${hairObj.svg}</svg>` : '';

        // 头饰多层叠戴渲染（绝对定位不移位）
        const headArray = Array.isArray(currentDress.headwear) ? currentDress.headwear : (currentDress.headwear ? [currentDress.headwear] : []);
        let headHtml = '';
        headArray.forEach(hId => {
            const hObj = getObj(WARDROBE_PARTS.headwear, hId);
            if (hObj && !hObj.isNone) {
                headHtml += `<div class="layer-sub-item"><img src="${hObj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" style="display:none;">${hObj.svg}</svg></div>`;
            }
        });
        document.getElementById('layer-headwear').innerHTML = headHtml;

        // 配饰多件叠穿渲染（绝对定位不移位）
        const accArray = Array.isArray(currentDress.accessory) ? currentDress.accessory : (currentDress.accessory ? [currentDress.accessory] : []);
        let accHtml = '';
        accArray.forEach(accId => {
            const accObj = getObj(WARDROBE_PARTS.accessory, accId);
            if (accObj && !accObj.isNone) {
                accHtml += `<div class="layer-sub-item"><img src="${accObj.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><svg viewBox="0 0 220 260" style="display:none;">${accObj.svg}</svg></div>`;
            }
        });
        document.getElementById('layer-accessory').innerHTML = accHtml;
    }

    function randomizeOutfit() {
        playCuteSound('fanfare');
        const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
        currentDress.body = rand(WARDROBE_PARTS.body).id;
        currentDress.maker = rand(WARDROBE_PARTS.maker).id;
        currentDress.pants = rand(WARDROBE_PARTS.pants).id;
        currentDress.shoes = rand(WARDROBE_PARTS.shoes).id;
        currentDress.top = rand(WARDROBE_PARTS.top).id;
        currentDress.face = rand(WARDROBE_PARTS.face).id;
        currentDress.hair = rand(WARDROBE_PARTS.hair).id;

        const validHeads = WARDROBE_PARTS.headwear.filter(h => !h.isNone);
        const headCount = Math.floor(Math.random() * 3);
        const pickedHeads = [];
        for (let i = 0; i < headCount; i++) {
            const pick = rand(validHeads).id;
            if (!pickedHeads.includes(pick)) pickedHeads.push(pick);
        }
        currentDress.headwear = pickedHeads;

        const validAccs = WARDROBE_PARTS.accessory.filter(a => !a.isNone);
        const count = Math.floor(Math.random() * 3);
        const picked = [];
        for (let i = 0; i < count; i++) {
            const pick = rand(validAccs).id;
            if (!picked.includes(pick)) picked.push(pick);
        }
        currentDress.accessory = picked;

        updateModelDisplay();
        renderCardsView();
        showToast('随机穿搭搞定');
    }

    function resetOutfit() {
        playCuteSound('pop');
        currentDress = JSON.parse(JSON.stringify(DEFAULT_DRESS));
        updateModelDisplay();
        renderCardsView();
        showToast('已恢复经典造型');
    }

    /* 拍立得 1:1 图片离屏合成 */
    function openPolaroidPoster() {
        playCuteSound('shutter');
        renderCanvasToImage();
        document.getElementById('poster-mask').style.display = 'flex';
    }

    function updatePhotoWithID() {
        playCuteSound('tap');
        renderCanvasToImage();
        showToast('搭配师署名已更新');
    }

    function renderCanvasToImage() {
        const cvs = document.getElementById('hidden-canvas');
        const ctx = cvs.getContext('2d');
        const S = 720; // 1:1 正方形卡纸

        ctx.fillStyle = '#FFF5E1';
        ctx.fillRect(0, 0, S, S);
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#FAD6A5';
        ctx.strokeRect(4, 4, S - 8, S - 8);

        ctx.save();
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = '#FAD6A5';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.roundRect(S / 2 - 110, 20, 220, 38, [19]);
        ctx.fill();
        ctx.stroke();

        ctx.font = '900 18px -apple-system, sans-serif';
        ctx.fillStyle = '#8B5A2B';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('苗哥私服写真', S / 2, 39);

        ctx.font = '900 30px -apple-system, sans-serif';
        ctx.fillStyle = '#D2691E';
        ctx.fillText('苗哥的衣橱', S / 2, 88);
        ctx.restore();

        const frameSize = 420;
        const frameX = (S - frameSize) / 2;
        const frameY = 118;
        ctx.save();
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(frameX, frameY, frameSize, frameSize);
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#DEB887';
        ctx.setLineDash([10, 8]);
        ctx.strokeRect(frameX, frameY, frameSize, frameSize);
        ctx.restore();

        function drawCuteTape(cx, cy, angleDeg) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angleDeg * Math.PI / 180);
            ctx.fillStyle = 'rgba(255, 175, 155, 0.85)';
            ctx.shadowColor = 'rgba(180, 100, 60, 0.2)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetY = 2;
            ctx.beginPath();
            ctx.roundRect(-42, -10, 84, 20, [4]);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-38, -7, 76, 14);
            ctx.restore();
        }
        drawCuteTape(frameX + 16, frameY + 16, -26);
        drawCuteTape(frameX + frameSize - 16, frameY + 16, 26);

        const renderW = 310;
        const renderH = (310 / 220) * 260;
        const drawX = frameX + (frameSize - renderW) / 2;
        const drawY = frameY + (frameSize - renderH) - 8;

        const layerIds = [
            'layer-body', 'layer-maker', 'layer-pants', 'layer-shoes',
            'layer-top', 'layer-face', 'layer-hair', 'layer-headwear', 'layer-accessory'
        ];

        layerIds.forEach(id => {
            const container = document.getElementById(id);
            if (!container) return;
            
            const imgs = container.querySelectorAll('img');
            imgs.forEach(imgEl => {
                if (imgEl && imgEl.complete && imgEl.naturalWidth > 0 && imgEl.style.display !== 'none') {
                    try {
                        ctx.drawImage(imgEl, drawX, drawY, renderW, renderH);
                    } catch(e) {}
                }
            });

            const svgs = container.querySelectorAll('svg');
            svgs.forEach(svgEl => {
                if (svgEl && svgEl.style.display !== 'none') {
                    const xml = new XMLSerializer().serializeToString(svgEl);
                    const svgImg = new Image();
                    svgImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
                    if (svgImg.complete) {
                        try {
                            ctx.drawImage(svgImg, drawX, drawY, renderW, renderH);
                        } catch(e) {}
                    }
                }
            });
        });

        const userNick = (document.getElementById('nickname-input')?.value.trim()) || '林科森';
        ctx.save();
        ctx.font = '900 21px -apple-system, sans-serif';
        ctx.fillStyle = '#D2691E';
        ctx.textAlign = 'center';
        ctx.fillText(`搭配师：${userNick}`, S / 2, 574);
        ctx.restore();

        const badgeCenterX = S / 2;
        const badgeCenterY = 620;
        const pillW = 200;
        const pillH = 38;

        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.strokeStyle = '#FAD6A5';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(badgeCenterX - pillW / 2, badgeCenterY - pillH / 2, pillW, pillH, [pillH / 2]);
        ctx.fill();
        ctx.stroke();

        const topLogoImg = document.querySelector('.logo-wrap img');
        if (topLogoImg && topLogoImg.complete && topLogoImg.naturalWidth > 0 && topLogoImg.style.display !== 'none') {
            ctx.save();
            ctx.beginPath();
            ctx.arc(badgeCenterX - 65, badgeCenterY, 13, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(topLogoImg, badgeCenterX - 78, badgeCenterY - 13, 26, 26);
            ctx.restore();
        } else {
            ctx.fillStyle = '#FF7043';
            ctx.strokeStyle = '#DEB887';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(badgeCenterX - 65, badgeCenterY, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.font = '900 13px -apple-system, sans-serif';
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('苗', badgeCenterX - 65, badgeCenterY);
        }

        ctx.font = 'bold 15px -apple-system, sans-serif';
        ctx.fillStyle = '#8B5A2B';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('演员谢苗超话', badgeCenterX - 45, badgeCenterY + 1);

        ctx.font = '900 14px -apple-system, sans-serif';
        ctx.fillStyle = '#CD853F';
        ctx.textAlign = 'center';
        ctx.fillText('长按保存图片', S / 2, 672);
        ctx.restore();

        const photoUrl = cvs.toDataURL('image/png');
        const targetImg = document.getElementById('final-photo-img');
        targetImg.src = photoUrl;
    }

    function closePoster() {
        playCuteSound('pop');
        document.getElementById('poster-mask').style.display = 'none';
    }

    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        clearTimeout(toastTimer);
        t.innerText = msg;
        t.style.opacity = 1;
        toastTimer = setTimeout(() => t.style.opacity = 0, 1800);
    }

    function playCuteSound(type) {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            const now = ctx.currentTime;

            if (type === 'tap') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'dress') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.12);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'fanfare') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(659.25, now + 0.06);
                osc.frequency.setValueAtTime(880, now + 0.12);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'shutter') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            }
        } catch(e) {}
    }
