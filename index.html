<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>合成大苗哥·消消乐版</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; touch-action: none; }
        
        html, body {
            width: 100%; height: 100%; height: 100dvh; overflow: hidden;
            background-color: #FFF8EA; color: #5C4033;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(#FAD6A5 10%, transparent 11%); background-size: 30px 30px;
        }

        #arcade-container {
            width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column;
            background-color: #FFFFFF; border-left: 4px solid #FAD6A5; border-right: 4px solid #FAD6A5;
            box-shadow: 0 10px 25px rgba(200, 180, 160, 0.5); position: relative; overflow: hidden;
        }

        /* 顶部看板 */
        .top-bar {
            width: 100%; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
            background: #FFEFD5; border-bottom: 3px solid #DEB887; z-index: 20; flex-shrink: 0;
        }
        .header-layout { display: flex; align-items: center; gap: 6px; }
        .title-group h1 { font-size: 18px; color: #D2691E; font-weight: 900; margin: 0; white-space: nowrap; }
        .subtitle { font-size: 11px; color: #8B5A2B; font-weight: bold; margin-top: 2px; }
        
        .icon-btn {
            width: 32px; height: 32px; background: rgba(255, 255, 255, 0.9);
            border: 2px solid #DEB887; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 14px; cursor: pointer; box-shadow: 0 2px 5px rgba(210, 105, 30, 0.15); transition: transform 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); }

        .score-board { text-align: right; background: #FFFFFF; padding: 4px 10px; border-radius: 15px; border: 2px dashed #DEB887; }
        .score-label { font-size: 14px; color: #FF9800; font-weight: 900; }
        .score-val { font-size: 22px; font-weight: 900; color: #FF9800; font-family: 'Arial Black', sans-serif; line-height: 1.1; }

        /* 角色舞台 */
        #top-stage {
            height: 22%; width: 100%; position: relative; z-index: 10;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            background-color: #FFFDF9; background-image: url('stage_bg.webp'); 
            background-size: cover; background-position: center; border-bottom: 4px solid #DEB887;
        }
        
        #character-avatar {
            width: 120px; height: 120px; z-index: 2;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center; margin-bottom: -15px; 
            background-size: contain; background-repeat: no-repeat; background-position: bottom center;
            font-size: 80px; display: flex; justify-content: center; align-items: flex-end;
        }
        
        #character-name {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: #D2691E; font-size: 13px; font-weight: 900; background: #FFEFD5; padding: 4px 16px;
            border-radius: 20px; border: 2px dashed #DEB887; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        #desk {
            width: 100%; height: 35px; z-index: 3; display: flex; justify-content: center; align-items: flex-start;
            background-color: #DEB887; background-image: url('desk_bar.webp');
            background-size: cover; background-position: top center; border-top: 3px solid #CD853F;
        }
        
        #desk-prop {
            width: 45px; height: 45px; margin-top: -22px; font-size: 24px; display: flex; justify-content: center; align-items: center;
            background-size: contain; background-repeat: no-repeat; background-position: center; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* 消除盘面 */
        #game-wrapper {
            position: relative; width: 100%; flex: 1; margin: 0 auto; background: #FFFDF9;
            display: flex; justify-content: center; align-items: center; padding: 10px;
            box-shadow: inset 0 0 20px rgba(222, 184, 135, 0.3);
        }
        #grid-container {
            position: relative; background: rgba(255, 255, 255, 0.8);
            border: 4px solid #DEB887; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(200, 180, 160, 0.4);
        }
        .bg-cell { position: absolute; border: 1px solid rgba(222, 184, 135, 0.2); }
        .bg-cell.light { background-color: rgba(255, 248, 234, 0.7); }
        .bg-cell.dark { background-color: rgba(250, 214, 165, 0.4); }

        .tile {
            position: absolute; display: flex; justify-content: center; align-items: center; font-size: 24px;
            transition: top 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.1), left 0.2s ease-out, transform 0.2s;
            cursor: pointer; z-index: 10; background-size: contain; background-repeat: no-repeat; background-position: center;
        }
        .tile::after { content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; opacity: 0.9; z-index: 12; background-size: cover;}
        .tile.effect-row::after { background-image: url('eff_row.webp'); background-color: rgba(210,105,30,0.3); }
        .tile.effect-col::after { background-image: url('eff_col.webp'); background-color: rgba(210,105,30,0.3); }
        .tile.effect-cross::after { background-image: url('eff_cross.webp'); background-color: rgba(255,152,0,0.5); border-radius: 50%;}
        .tile.selected { transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(210, 105, 30, 0.8)); z-index: 20; }
        .tile.matched { animation: popOut 0.3s forwards; }
        @keyframes popOut { 50% { transform: scale(1.3); opacity: 0.8; } 100% { transform: scale(0); opacity: 0; } }
        .blast-wave { position: absolute; background: #FFA07A; opacity: 0.8; z-index: 15; pointer-events: none; transition: all 0.3s ease-out; }

        /* 底部道具区 */
        #bottom-tools {
            height: 12%; width: 100%; background: #FFEFD5; border-top: 4px solid #DEB887;
            display: flex; justify-content: space-evenly; align-items: center; padding: 0 10px;
        }
        .tool-btn {
            background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 6px 12px;
            display: flex; align-items: center; gap: 4px; cursor: pointer; transition: all 0.2s;
            border: 2px solid #DEB887; box-shadow: 0 4px 8px rgba(200, 180, 160, 0.3);
        }
        .tool-btn:active { transform: scale(0.95); }
        .tool-btn.active-prop { background: #FFF0F5; border-color: #FF1493 !important; transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 20, 147, 0.5); }
        .tool-btn.disabled { opacity: 0.5; pointer-events: none; filter: grayscale(100%); }
        .tool-icon { font-size: 18px; pointer-events: none; }
        .tool-count { font-size: 13px; font-weight: 900; white-space: nowrap; pointer-events: none; }
        
        #bomb-tool { border-color: #FF334B; color: #FF334B; }
        #shake-tool { border-color: #4169E1; color: #4169E1; }
        #hammer-tool { border-color: #3CB371; color: #3CB371; }

        /* 设置面板 */
        #settings-mask {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 248, 234, 0.95); backdrop-filter: blur(4px);
            flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .settings-box {
            background: #FFF5E1; border: 4px solid #FAD6A5; border-radius: 20px;
            padding: 20px; width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 10px 25px rgba(200, 180, 160, 0.4); max-height: 85%; overflow-y: auto;
        }
        .settings-title { font-size: 20px; font-weight: 900; color: #D2691E; margin-bottom: 15px; }
        .settings-btn {
            width: 100%; padding: 10px; margin-bottom: 10px; border: none; border-radius: 20px;
            font-size: 15px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.2s;
        }
        .settings-btn:active { transform: translateY(2px); }
        .btn-green { background-color: #3CB371; box-shadow: 0 4px 0 #2E8B57; }
        .btn-blue { background-color: #4169E1; box-shadow: 0 4px 0 #27408B; }
        .btn-pink { background-color: #FFB6C1; box-shadow: 0 4px 0 #FF69B4; }
        
        #save-list-container {
            margin: 15px 0; border: 2px dashed #DEB887; border-radius: 10px; padding: 10px;
            background: #FFFFFF; min-height: 80px; max-height: 200px; overflow-y: auto;
        }
        .save-item {
            background: #FFEFD5; border: 1px solid #DEB887; padding: 8px; margin-bottom: 8px;
            border-radius: 8px; font-size: 13px; color: #D2691E; font-weight: bold; cursor: pointer;
        }
        .save-item:active { background: #FFE4C4; }
        .save-hint { font-size: 11px; color: #CD853F; margin-top: -5px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<audio id="bgm" src="./my-bgm.mp3" loop preload="auto"></audio>

<div id="arcade-container">
    <div class="top-bar">
        <div class="header-layout">
            <div class="title-group">
                <h1>合成大苗哥</h1>
                <div class="subtitle">消除排练场</div>
            </div>
        </div>
        <div class="header-layout">
            <div id="settings-toggle" class="icon-btn">⚙️</div>
            <div class="score-board">
                <div class="score-label">总战力</div>
                <div class="score-val" id="score">0</div>
            </div>
        </div>
    </div>

    <div id="top-stage">
        <div id="character-name">第一阶段：洪文定</div>
        <div id="character-avatar" style="background-image: url('avatar_1.webp');">👦</div>
        <div id="desk"><div id="desk-prop" style="background-image: url('prop_1.webp');">🍵</div></div>
    </div>

    <div id="game-wrapper">
        <div id="grid-container"></div>
    </div>

    <div id="bottom-tools">
        <div class="tool-btn" id="bomb-tool"><span class="tool-icon">💣</span><span class="tool-count" id="count-bomb">炸弹 × 2</span></div>
        <div class="tool-btn" id="shake-tool"><span class="tool-icon">🌀</span><span class="tool-count" id="count-refresh">刷新 × 3</span></div>
        <div class="tool-btn" id="hammer-tool"><span class="tool-icon">🔨</span><span class="tool-count" id="count-hammer">单点 × 3</span></div>
    </div>

    <div id="settings-mask">
        <div class="settings-box">
            <div class="settings-title">系统菜单</div>
            <button class="settings-btn btn-green" onclick="saveGame()">💾 记录当前进度</button>
            <div style="text-align: left; margin-top: 15px; color: #8B5A2B; font-weight: 900; font-size: 14px;">本地存档：</div>
            <div class="save-hint">※ 点击读取，长按删除</div>
            <div id="save-list-container"></div>
            <button class="settings-btn btn-blue" onclick="location.reload()">🔄 重新开始</button>
            <button class="settings-btn btn-pink" onclick="closeSettings()">返回游戏</button>
        </div>
    </div>
</div>

<script>
    // ===== 音效与存读档模块 =====
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

    function playSFX(type) {
        initAudio(); const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        if (type === 'swap') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); } 
        else if (type === 'match') { osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15); gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); } 
        else if (type === 'explode') { osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4); gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
    }

    const bgm = document.getElementById('bgm');
    document.body.addEventListener('click', () => { if(bgm.paused) { bgm.play(); } }, { once: true });

    const settingsMask = document.getElementById('settings-mask');
    document.getElementById('settings-toggle').onclick = () => { renderSaveList(); settingsMask.style.display = 'flex'; };
    function closeSettings() { settingsMask.style.display = 'none'; }
    function getSaves() { return JSON.parse(localStorage.getItem('miao10Saves') || '{}'); }
    function setSaves(saves) { localStorage.setItem('miao10Saves', JSON.stringify(saves)); }

    function saveGame() {
        let saves = getSaves(); let timeStr = new Date().toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
        saves[`存档_${timeStr}`] = { score, currentStage, props, board: board.map(row => row.map(cell => ({...cell}))) };
        setSaves(saves); renderSaveList(); alert('进度已保存！');
    }

    function renderSaveList() {
        const container = document.getElementById('save-list-container');
        const saves = getSaves(); container.innerHTML = '';
        Object.keys(saves).reverse().forEach(key => {
            let div = document.createElement('div'); div.className = 'save-item'; div.innerText = `${key} (战力: ${saves[key].score})`;
            let pressTimer; let isLongPress = false;
            const startPress = () => { isLongPress = false; pressTimer = setTimeout(() => { isLongPress = true; deleteSave(key); }, 800); };
            const cancelPress = () => clearTimeout(pressTimer);
            div.addEventListener('touchstart', startPress, {passive: true}); div.addEventListener('touchend', () => { cancelPress(); if(!isLongPress) loadGame(key); }); div.addEventListener('touchmove', cancelPress, {passive: true});
            div.addEventListener('mousedown', startPress); div.addEventListener('mouseup', () => { cancelPress(); if(!isLongPress) loadGame(key); }); div.addEventListener('mouseleave', cancelPress);
            container.appendChild(div);
        });
        if(container.innerHTML === '') container.innerHTML = '<div style="color:#999; font-size:12px; margin-top:20px;">暂无本地存档</div>';
    }
    function deleteSave(key) { if(confirm(`确定删除 [${key}] 吗？`)) { let saves = getSaves(); delete saves[key]; setSaves(saves); renderSaveList(); } }

    function loadGame(key) {
        let data = getSaves()[key]; if(!data) return;
        score = data.score; currentStage = data.currentStage; props = data.props;
        document.getElementById('score').innerText = score; applyEvolution(currentStage); updatePropUI();
        board = data.board; gridContainer.innerHTML = ''; domTiles = [];
        for (let r = 0; r < ROWS; r++) { domTiles[r] = []; for (let c = 0; c < COLS; c++) {
            const bg = document.createElement('div'); bg.className = `bg-cell ${(r + c) % 2 === 0 ? 'dark' : 'light'}`;
            bg.style.width = bg.style.height = `${TILE_SIZE}px`; bg.style.left = `${c * TILE_SIZE}px`; bg.style.top = `${r * TILE_SIZE}px`;
            gridContainer.appendChild(bg); createTileDOM(r, c, board[r][c]);
        }}
        closeSettings();
    }

    // ===== 核心配置与10阶进化数据 =====
    const ROWS = 9, COLS = 9; // 扩大网格以平衡 7 种元素的难度
    let TILE_SIZE = 40;
    const TYPES = ['🥋', '🕶️', '🗡️', '👊', '🧨', '📿', '🍶']; 
    
    const EVOLUTION = [
        { score: 0,     name: "第一阶段：洪文定", avatar: "url('avatar_1.webp')", fallback: "👦", prop: "url('prop_1.webp')", propFallback: "🍵" },
        { score: 800,   name: "第二阶段：海远",   avatar: "url('avatar_2.webp')", fallback: "🧑", prop: "url('prop_2.webp')", propFallback: "🥢" },
        { score: 2000,  name: "第三阶段：巩固",   avatar: "url('avatar_3.webp')", fallback: "👨", prop: "url('prop_3.webp')", propFallback: "🎒" },
        { score: 4000,  name: "第四阶段：惠忍",   avatar: "url('avatar_4.webp')", fallback: "🦲", prop: "url('prop_4.webp')", propFallback: "📿" },
        { score: 7000,  name: "第五阶段：韩晓峰", avatar: "url('avatar_5.webp')", fallback: "🧥", prop: "url('prop_5.webp')", propFallback: "📱" },
        { score: 11000, name: "第六阶段：李红旗", avatar: "url('avatar_6.webp')", fallback: "👮", prop: "url('prop_6.webp')", propFallback: "🚔" },
        { score: 16000, name: "第七阶段：成瞎子", avatar: "url('avatar_7.webp')", fallback: "🦯", prop: "url('prop_7.webp')", propFallback: "🍶" },
        { score: 22000, name: "第八阶段：张柳成", avatar: "url('avatar_8.webp')", fallback: "👔", prop: "url('prop_8.webp')", propFallback: "🪓" },
        { score: 30000, name: "第九阶段：黄铭金", avatar: "url('avatar_9.webp')", fallback: "🕶️", prop: "url('prop_9.webp')", propFallback: "💼" },
        { score: 40000, name: "终极阶段：火遮眼", avatar: "url('avatar_10.webp')", fallback: "🔥", prop: "url('prop_10.webp')", propFallback: "🩸" }
    ];

    let board = [], domTiles = [], score = 0, currentStage = 0, selectedTile = null, isAnimating = false, lastSwapPos = null;
    let props = { bomb: 2, refresh: 3, hammer: 3 }; let activeProp = null;
    const gridContainer = document.getElementById('grid-container');

    function updatePropUI() {
        document.getElementById('count-bomb').innerText = `炸弹 × ${props.bomb}`;
        document.getElementById('count-refresh').innerText = `刷新 × ${props.refresh}`;
        document.getElementById('count-hammer').innerText = `单点 × ${props.hammer}`;
        ['bomb', 'refresh', 'hammer'].forEach(p => { const el = document.getElementById(p === 'refresh' ? 'shake-tool' : `${p}-tool`); if (props[p] <= 0) el.classList.add('disabled'); else el.classList.remove('disabled'); });
    }

    function applyEvolution(stageIdx) {
        currentStage = stageIdx; const av = document.getElementById('character-avatar');
        av.style.transform = "scale(1.3) translateY(-10px)";
        setTimeout(() => {
            av.style.backgroundImage = EVOLUTION[currentStage].avatar; av.innerText = EVOLUTION[currentStage].fallback;
            document.getElementById('character-name').innerText = EVOLUTION[currentStage].name;
            const prop = document.getElementById('desk-prop');
            prop.style.backgroundImage = EVOLUTION[currentStage].prop; prop.innerText = EVOLUTION[currentStage].propFallback;
            av.style.transform = "scale(1) translateY(0)";
        }, 150);
    }

    function initSize() {
        const boardWidth = document.getElementById('game-wrapper').clientWidth - 20;
        TILE_SIZE = Math.floor(Math.min(boardWidth, 400) / COLS);
        gridContainer.style.width = `${TILE_SIZE * COLS}px`; gridContainer.style.height = `${TILE_SIZE * ROWS}px`;
    }

    function initBoard() {
        for (let r = 0; r < ROWS; r++) {
            board[r] = []; domTiles[r] = [];
            for (let c = 0; c < COLS; c++) {
                const bg = document.createElement('div'); bg.className = `bg-cell ${(r + c) % 2 === 0 ? 'dark' : 'light'}`;
                bg.style.width = bg.style.height = `${TILE_SIZE}px`; bg.style.left = `${c * TILE_SIZE}px`; bg.style.top = `${r * TILE_SIZE}px`;
                gridContainer.appendChild(bg);
                let type; do { type = TYPES[Math.floor(Math.random() * TYPES.length)]; } 
                while ((c >= 2 && board[r][c-1]?.type === type && board[r][c-2]?.type === type) || (r >= 2 && board[r-1][c]?.type === type && board[r-2][c]?.type === type));
                board[r][c] = { type, effect: 'none' }; createTileDOM(r, c, board[r][c]);
            }
        }
    }

    function createTileDOM(r, c, data) {
        const tile = document.createElement('div'); tile.className = `tile ${data.effect !== 'none' ? 'effect-'+data.effect : ''}`;
        tile.innerText = data.type; // 占位字符，美工可以用 CSS 或者 JS 这里写入 background-image: url('tile_x.webp')
        tile.style.width = tile.style.height = `${TILE_SIZE}px`; tile.style.top = `${r * TILE_SIZE}px`; tile.style.left = `${c * TILE_SIZE}px`;
        tile.addEventListener('pointerdown', () => handleTileClick(r, c));
        gridContainer.appendChild(tile); domTiles[r][c] = tile; return tile;
    }

    document.getElementById('bomb-tool').onclick = () => toggleProp('bomb');
    document.getElementById('hammer-tool').onclick = () => toggleProp('hammer');
    document.getElementById('shake-tool').onclick = async () => {
        if (isAnimating || props.refresh <= 0) return; props.refresh--; updatePropUI(); deactiveProps(); isAnimating = true;
        for (let r = 0; r < ROWS; r++) { for (let c = 0; c < COLS; c++) {
            let type; do { type = TYPES[Math.floor(Math.random() * TYPES.length)]; } while ((c >= 2 && board[r][c-1]?.type === type && board[r][c-2]?.type === type) || (r >= 2 && board[r-1][c]?.type === type && board[r-2][c]?.type === type));
            board[r][c] = { type, effect: 'none' }; domTiles[r][c].className = 'tile'; domTiles[r][c].innerText = type;
            domTiles[r][c].style.transform = 'scale(0)'; setTimeout(() => domTiles[r][c].style.transform = 'scale(1)', 50);
        }} await sleep(300); isAnimating = false;
    };

    function toggleProp(type) { if (props[type] <= 0 || isAnimating) return; deactiveProps(); if (activeProp !== type) { activeProp = type; document.getElementById(`${type}-tool`).classList.add('active-prop'); gridContainer.style.cursor = 'crosshair'; } }
    function deactiveProps() { document.getElementById('bomb-tool').classList.remove('active-prop'); document.getElementById('hammer-tool').classList.remove('active-prop'); gridContainer.style.cursor = 'default'; activeProp = null; }

    async function handleTileClick(r, c) {
        if (isAnimating) return;
        if (activeProp) {
            isAnimating = true; let toRemove = new Set();
            if (activeProp === 'hammer') { props.hammer--; toRemove.add(`${r},${c}`); } 
            else if (activeProp === 'bomb') { props.bomb--; for(let i=r-1; i<=r+1; i++) for(let j=c-1; j<=c+1; j++) if(i>=0 && i<ROWS && j>=0 && j<COLS) toRemove.add(`${i},${j}`); }
            updatePropUI(); deactiveProps(); await processMatches({ toRemove, newSpecials: [] }); return;
        }

        const tile = domTiles[r][c];
        if (!selectedTile) { selectedTile = { r, c, dom: tile }; tile.classList.add('selected'); } 
        else {
            selectedTile.dom.classList.remove('selected');
            if (Math.abs(selectedTile.r - r) + Math.abs(selectedTile.c - c) === 1) {
                isAnimating = true; lastSwapPos = { r, c }; swapDataAndDOM(selectedTile.r, selectedTile.c, r, c); await sleep(250);
                const matchInfo = analyzeMatches();
                if (matchInfo.toRemove.size > 0) { await processMatches(matchInfo); } else { swapDataAndDOM(selectedTile.r, selectedTile.c, r, c); await sleep(250); isAnimating = false; }
            }
            selectedTile = null;
        }
    }

    function swapDataAndDOM(r1, c1, r2, c2) {
        const temp = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = temp;
        const dTemp = domTiles[r1][c1]; domTiles[r1][c1] = domTiles[r2][c2]; domTiles[r2][c2] = dTemp;
        domTiles[r1][c1].style.top = `${r1 * TILE_SIZE}px`; domTiles[r1][c1].style.left = `${c1 * TILE_SIZE}px`; domTiles[r2][c2].style.top = `${r2 * TILE_SIZE}px`; domTiles[r2][c2].style.left = `${c2 * TILE_SIZE}px`;
        domTiles[r1][c1].onclick = null; domTiles[r2][c2].onclick = null;
        domTiles[r1][c1].addEventListener('pointerdown', () => handleTileClick(r1, c1), {once: true}); domTiles[r2][c2].addEventListener('pointerdown', () => handleTileClick(r2, c2), {once: true});
    }

    function analyzeMatches() {
        let toRemove = new Set(), newSpecials = [], hLines = [], vLines = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS - 2; c++) { let len = 1; while (c+len < COLS && board[r][c]?.type === board[r][c+len]?.type && board[r][c]) len++; if (len >= 3) { let l=[]; for(let i=0;i<len;i++) l.push(`${r},${c+i}`); hLines.push({ type: board[r][c].type, cells: l, r, c, len }); c += len-1; } }
        for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS - 2; r++) { let len = 1; while (r+len < ROWS && board[r][c]?.type === board[r+len][c]?.type && board[r][c]) len++; if (len >= 3) { let l=[]; for(let i=0;i<len;i++) l.push(`${r+i},${c}`); vLines.push({ type: board[r][c].type, cells: l, r, c, len }); r += len-1; } }
        hLines.forEach(hl => { vLines.forEach(vl => { if (hl.type === vl.type) { const intersect = hl.cells.find(c => vl.cells.includes(c)); if (intersect) { let [ir, ic] = intersect.split(',').map(Number); hl.handled = vl.handled = true; hl.cells.concat(vl.cells).forEach(c => toRemove.add(c)); newSpecials.push({ r: ir, c: ic, type: hl.type, effect: 'cross' }); } } });});
        [...hLines, ...vLines].filter(l => !l.handled).forEach(l => { if (l.len >= 4) { let tp = lastSwapPos && l.cells.includes(`${lastSwapPos.r},${lastSwapPos.c}`) ? lastSwapPos : { r: l.r, c: l.c }; newSpecials.push({ r: tp.r, c: tp.c, type: l.type, effect: l.cells[0].charAt(0) === l.cells[1].charAt(0) ? 'row' : 'col' }); } l.cells.forEach(c => toRemove.add(c)); });
        return { toRemove, newSpecials };
    }

    async function triggerSpecial(r, c, effect, toRemoveSet) {
        if (effect === 'row' || effect === 'cross') { createBlastVisual('row', r, c); for(let ic=0; ic<COLS; ic++) processBlastCell(r, ic, toRemoveSet); }
        if (effect === 'col' || effect === 'cross') { createBlastVisual('col', r, c); for(let ir=0; ir<ROWS; ir++) processBlastCell(ir, c, toRemoveSet); }
    }
    function processBlastCell(r, c, set) { const k = `${r},${c}`; if (!set.has(k) && board[r][c]) { set.add(k); if (board[r][c].effect !== 'none') triggerSpecial(r, c, board[r][c].effect, set); } }
    
    function createBlastVisual(dir, r, c) {
        const blast = document.createElement('div'); blast.className = 'blast-wave';
        if(dir === 'row') { blast.style.left = '0'; blast.style.top = `${r * TILE_SIZE + TILE_SIZE/2 - 2}px`; blast.style.width = `${COLS * TILE_SIZE}px`; blast.style.height = '4px'; } 
        else { blast.style.top = '0'; blast.style.left = `${c * TILE_SIZE + TILE_SIZE/2 - 2}px`; blast.style.height = `${ROWS * TILE_SIZE}px`; blast.style.width = '4px'; }
        gridContainer.appendChild(blast); setTimeout(() => blast.remove(), 300);
    }

    async function processMatches(matchInfo) {
        let { toRemove, newSpecials } = matchInfo;
        toRemove.forEach(str => { let [r, c] = str.split(',').map(Number); if (board[r][c] && board[r][c].effect !== 'none') triggerSpecial(r, c, board[r][c].effect, toRemove); });
        toRemove.forEach(str => { let [r, c] = str.split(',').map(Number); if (domTiles[r][c]) { domTiles[r][c].classList.add('matched'); board[r][c] = null; } });
        playSFX('match');
        
        score += toRemove.size * 10; document.getElementById('score').innerText = score;
        if (currentStage < EVOLUTION.length - 1 && score >= EVOLUTION[currentStage + 1].score) applyEvolution(currentStage + 1);

        await sleep(300);
        toRemove.forEach(str => { let [r, c] = str.split(',').map(Number); if (domTiles[r][c]) { domTiles[r][c].remove(); domTiles[r][c] = null; } });
        newSpecials.forEach(sp => { board[sp.r][sp.c] = { type: sp.type, effect: sp.effect }; createTileDOM(sp.r, sp.c, board[sp.r][sp.c]); });
        
        await applyGravity(); lastSwapPos = null; const nextInfo = analyzeMatches();
        if (nextInfo.toRemove.size > 0) await processMatches(nextInfo); else isAnimating = false;
    }

    async function applyGravity() {
        for (let c = 0; c < COLS; c++) {
            let empty = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!board[r][c]) empty++;
                else if (empty > 0) {
                    board[r + empty][c] = board[r][c]; domTiles[r + empty][c] = domTiles[r][c];
                    board[r][c] = null; domTiles[r][c] = null;
                    domTiles[r + empty][c].style.top = `${(r + empty) * TILE_SIZE}px`;
                    let nr = r + empty; domTiles[nr][c].onclick = null; domTiles[nr][c].addEventListener('pointerdown', () => handleTileClick(nr, c), {once: true});
                }
            }
            for (let i = 0; i < empty; i++) {
                const type = TYPES[Math.floor(Math.random() * TYPES.length)]; board[i][c] = { type, effect: 'none' };
                const nTile = createTileDOM(i, c, board[i][c]); nTile.style.top = `${(i - empty) * TILE_SIZE}px`; nTile.offsetHeight; nTile.style.top = `${i * TILE_SIZE}px`;
            }
        }
        await sleep(300);
    }

    function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }
    initSize(); initBoard(); updatePropUI(); applyEvolution(0);
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
