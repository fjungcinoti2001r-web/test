<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>合成大苗哥·演员谢苗超话制作</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #FFF8EA;
            color: #5C4033;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(#FAD6A5 10%, transparent 11%);
            background-size: 30px 30px;
        }

        #arcade-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            border-left: 4px solid #FAD6A5;
            border-right: 4px solid #FAD6A5;
            box-shadow: 0 10px 25px rgba(200, 180, 160, 0.5);
        }

        /* 顶部看板 */
        .top-bar {
            width: 100%;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFEFD5;
            border-bottom: 3px solid #DEB887;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
            flex-shrink: 0;
        }

        .header-layout {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .logo-img {
            width: 45px; 
            height: 45px;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .title-group h1 {
            font-size: 18px;
            color: #D2691E;
            letter-spacing: 1px;
            font-weight: 900;
            white-space: nowrap;
            margin: 0;
        }
        .subtitle {
            font-size: 11px;
            color: #8B5A2B;
            font-weight: bold;
            margin-top: 2px;
            white-space: nowrap;
        }

        /* 音乐与暂停开关 */
        .icon-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #DEB887;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(210, 105, 30, 0.15);
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:active { transform: scale(0.9); }
        .bgm-paused { opacity: 0.6; }
        @keyframes spinBgm { 100% { transform: rotate(360deg); } }
        .bgm-playing { animation: spinBgm 4s linear infinite; }

        .score-board {
            text-align: right;
            background: #FFFFFF;
            padding: 4px 10px;
            border-radius: 15px;
            border: 2px dashed #DEB887;
            white-space: nowrap;
        }
        .score-label {
            font-size: 14px;
            color: #FF9800;
            font-weight: 900;
            text-shadow: 0 0 6px rgba(255, 152, 0, 0.3);
        }
        .score-val {
            font-size: 22px;
            font-weight: 900;
            color: #FF9800;
            font-family: 'Arial Black', sans-serif;
            line-height: 1.1;
            text-shadow: 0 0 8px rgba(255, 152, 0, 0.4);
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            margin: 0 auto;
            overflow: hidden;
            background: linear-gradient(180deg, #FFFDF9 0%, #FFF5E1 100%);
            box-shadow: inset 0 0 20px rgba(222, 184, 135, 0.3);
            touch-action: none;
        }

        /* 警戒线下调，给道具留出空间 */
        #danger-line {
            position: absolute;
            left: 0;
            top: 10%; 
            width: 100%;
            height: 2px;
            border-top: 2px dashed #FF6B6B;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
            pointer-events: none;
            z-index: 5;
        }
        
        #danger-label {
            position: absolute;
            right: 12px;
            top: -24px;
            font-size: 14px;
            color: #FF6B6B;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
            animation: warningGlow 1.5s ease-in-out infinite alternate;
        }
        @keyframes warningGlow {
            0% { text-shadow: 0 0 4px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 107, 107, 0.3); transform: scale(0.98); }
            100% { text-shadow: 0 0 8px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 107, 107, 0.7); transform: scale(1.02); }
        }

        /* ★ 左上角工具收纳栏（炸弹 & 重组） ★ */
        #tools-container {
            position: absolute;
            left: 10px;
            top: 12px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }
        .tool-btn {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 4px 8px;
            display: flex; 
            align-items: center;
            gap: 4px;
            cursor: grab;
            transition: transform 0.2s, opacity 0.2s;
        }
        .tool-btn:active { cursor: grabbing; transform: scale(0.95); }
        .tool-icon { font-size: 14px; pointer-events: none; }
        .tool-count { font-size: 12px; font-weight: 900; pointer-events: none; white-space: nowrap;}
        
        #bomb-container { border: 2px solid #FF334B; box-shadow: 2px 4px 8px rgba(255, 51, 75, 0.2); display: none; }
        #bomb-container .tool-count { color: #FF334B; }
        
        #shake-container { border: 2px solid #4169E1; box-shadow: 2px 4px 8px rgba(65, 105, 225, 0.2); }
        #shake-container .tool-count { color: #4169E1; }
        .tool-disabled { opacity: 0.5; pointer-events: none; border-color: #999 !important; }
        .tool-disabled .tool-count { color: #999 !important; }

        /* 拖动时的虚拟道具图层与蓄力圈 */
        #ghost-tool {
            display: none;
            position: fixed;
            font-size: 30px;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
        #ghost-tool-indicator {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px dashed;
            width: 100px; height: 100px;
            transition: width 0.05s, height 0.05s;
            z-index: -1;
        }

        /* 下落指示球 */
        #dropper-preview {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 8;
            background-size: cover;
            background-position: center;
            border: 2px solid #D2691E;
            box-shadow: 0 0 10px rgba(210, 105, 30, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #5C4033;
            font-weight: 900;
            text-shadow: 0 0 2px #FFF;
            text-align: center;
            padding: 4px;
            background-color: #FFE4C4;
            transition: all 0.1s;
        }

        /* 连击浮动大字 */
        .combo-text {
            position: absolute;
            font-weight: 900;
            color: #FFFDF9; 
            text-shadow: -1px -1px 0 #D2691E, 1px -1px 0 #D2691E, -1px 1px 0 #D2691E, 1px 1px 0 #D2691E, 0 0 12px #FFB6C1, 0 0 22px #FAD6A5, 0 0 30px #FFA07A; 
            pointer-events: none;
            z-index: 25;
            animation: comboFly 1s ease-out forwards;
            white-space: nowrap;
        }
        @keyframes comboFly {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            20% { opacity: 1; transform: translate(-50%, -70%) scale(1.3); }
            70% { opacity: 1; transform: translate(-50%, -100%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -130%) scale(0.85); }
        }

        .shake { animation: screenShake 0.15s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* 暂停与存档蒙层 */
        #pause-mask {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 248, 234, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 40;
        }
        .pause-title {
            font-size: 32px;
            font-weight: 900;
            color: #D2691E;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-shadow: 0 4px 10px rgba(210, 105, 30, 0.2);
        }

        #game-over-mask {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 248, 234, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding: 10px;
            overflow-y: auto;
        }

        #capture-area {
            width: 92%;
            max-width: 360px;
            background: #FFF5E1;
            border: 4px solid #FAD6A5;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(200, 180, 160, 0.4);
        }

        .poster-header-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border-radius: 30px;
            padding: 4px 12px;
            border: 2px solid #FAD6A5;
            margin-bottom: 6px;
        }
        .poster-badge {
            font-size: 14px;
            color: #8B5A2B;
            letter-spacing: 1px;
            font-weight: 900;
            white-space: nowrap;
            margin: 0 10px;
        }
        .poster-title {
            font-size: 26px;
            font-weight: 900;
            color: #D2691E;
            margin: 6px 0 12px 0;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(210, 105, 30, 0.2);
        }

        .score-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 8px 0;
            width: 100%;
        }

        .poster-egg-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            border: 2px solid #FAD6A5;
            background-color: #FFFFFF;
            background-image: url('cb4044f2-fb41-445d-8c10-60121c918ad9.jfif');
            background-size: cover;
            background-position: center;
            margin: 0;
            flex-shrink: 0;
        }

        .poster-score-box {
            background: #FFFFFF;
            border: 2px dashed #DEB887;
            padding: 10px 20px;
            border-radius: 12px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .poster-score-label {
            font-size: 13px;
            color: #8B5A2B;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .poster-score-num {
            font-size: 36px;
            color: #D2691E;
            font-weight: 900;
            font-family: 'Arial Black', sans-serif;
            line-height: 1;
            text-shadow: 0 0 10px rgba(210, 105, 30, 0.2);
        }

        .poster-role-tag {
            font-size: 14px;
            font-weight: 900;
            color: #D2691E;
            margin-top: 8px;
            padding: 6px 16px;
            background: #FFF0F5;
            border-radius: 15px;
            border: 2px dotted #FFB6C1;
            white-space: nowrap;
        }

        .poster-footer {
            font-size: 13px;
            color: #CD853F;
            font-weight: bold;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .mobile-poster-box {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 8px;
            width: 100%;
        }
        #final-poster-img {
            width: 85%;
            max-width: 320px;
            border-radius: 20px;
            border: 4px solid #FAD6A5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .save-tip {
            font-size: 13px;
            color: #D2691E;
            font-weight: 900;
            margin-top: 6px;
            background: #FFEFD5;
            padding: 4px 14px;
            border-radius: 15px;
            border: 2px dashed #DEB887;
            white-space: nowrap;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
            width: 85%;
            max-width: 320px;
        }
        .btn-core {
            border: none;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            color: white;
            white-space: nowrap;
        }
        .btn-orange { background-color: #FFA07A; box-shadow: 0 4px 0 #E9967A; }
        .btn-pink { background-color: #FFB6C1; box-shadow: 0 4px 0 #FF69B4; }
        .btn-blue { background-color: #6495ED; box-shadow: 0 4px 0 #4169E1; }
        .btn-green { background-color: #3CB371; box-shadow: 0 4px 0 #2E8B57; }
        .btn-core:active { transform: translateY(4px); box-shadow: none; }
        
        #save-toast {
            position: absolute;
            top: -40px;
            background: #FFF5E1;
            color: #D2691E;
            font-weight: 900;
            padding: 6px 16px;
            border-radius: 15px;
            border: 2px dashed #DEB887;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.3s, top 0.3s;
            pointer-events: none;
            z-index: 100;
        }
        .toast-show { top: 30px !important; opacity: 1 !important; }
    </style>
</head>
<body>

<audio id="bgm" src="./my-bgm.mp3" loop preload="auto"></audio>

<div id="arcade-container">
    <div class="top-bar">
        <div class="header-layout">
            <img src="gonggu.png" alt="巩固" class="logo-img">
            <div class="title-group">
                <h1>合成大苗哥</h1>
                <div class="subtitle">演员谢苗超话制作</div>
            </div>
        </div>
        <div class="header-layout">
            <div id="bgm-toggle" class="icon-btn bgm-paused">🔇</div>
            <div id="pause-toggle" class="icon-btn">⏸️</div>
            <div class="score-board">
                <div class="score-label">总战力</div>
                <div class="score-val" id="score">0</div>
            </div>
            <img src="xiemiao.png" alt="谢苗" class="logo-img">
        </div>
    </div>

    <div id="game-wrapper">
        <div id="danger-line"><span id="danger-label">苗友应激警戒线 ⚠️</span></div>
        <div id="dropper-preview"></div>

        <!-- ★ 道具栏：左上角并排显示 ★ -->
        <div id="tools-container">
            <div id="bomb-container" class="tool-btn">
                <span class="tool-icon">💣</span>
                <span id="bomb-count" class="tool-count">炸弹 × 0</span>
            </div>
            <div id="shake-container" class="tool-btn">
                <span class="tool-icon">🌀</span>
                <span id="shake-count" class="tool-count">重组 × 3</span>
            </div>
        </div>

        <!-- 暂停与存档蒙层 -->
        <div id="pause-mask">
            <div id="save-toast">✨ 进度已成功保存 ✨</div>
            <div class="pause-title">游戏暂停</div>
            
            <div id="pause-main-btns" class="btn-group" style="width: 220px; gap: 15px;">
                <button class="btn-core btn-orange" onclick="togglePause()">继续游戏 ▶️</button>
                <button class="btn-core btn-blue" onclick="showSaveMenu()">保存进度 💾</button>
                <button class="btn-core btn-green" id="load-btn" onclick="showLoadMenu()">读取进度 📂</button>
            </div>

            <div id="save-menu" style="display:none; background:#FFF5E1; padding: 20px; border-radius:15px; width: 85%; max-width: 300px; border: 3px solid #FAD6A5;">
                <h3 style="color:#D2691E; text-align:center; margin-bottom:15px;">新建存档</h3>
                <input type="text" id="save-name-input" placeholder="请输入存档名称..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 2px solid #DEB887; border-radius: 8px; font-weight:bold; color:#5C4033; font-size:14px; text-align:center;">
                <div style="display:flex; gap:10px;">
                    <button class="btn-core btn-blue" style="flex:1;" onclick="confirmSave()">确认保存</button>
                    <button class="btn-core btn-pink" style="flex:1;" onclick="backToPause()">取消</button>
                </div>
            </div>

            <div id="load-menu" style="display:none; background:#FFF5E1; padding: 20px; border-radius:15px; width: 85%; max-width: 300px; border: 3px solid #FAD6A5;">
                <h3 style="color:#D2691E; text-align:center; margin-bottom:15px;">读取存档</h3>
                <div id="save-list" style="max-height: 200px; overflow-y: auto; display:flex; flex-direction:column; gap:8px; margin-bottom:15px;">
                </div>
                <button class="btn-core btn-pink" style="width:100%;" onclick="backToPause()">返回</button>
            </div>
        </div>

        <div id="game-over-mask">
            <div id="capture-area">
                <div class="poster-header-pill">
                    <img src="gonggu.png" alt="巩固" style="width: 32px; height: 32px; object-fit: contain; mix-blend-mode: multiply;">
                    <div class="poster-badge">✨ 苗友成绩单 ✨</div>
                    <img src="xiemiao.png" alt="谢苗" style="width: 32px; height: 32px; object-fit: contain; mix-blend-mode: multiply;">
                </div>
                <div class="poster-title">合成大苗哥</div>
                <div class="score-layout">
                    <div class="poster-egg-img"></div>
                    <div class="poster-score-box">
                        <div class="poster-score-label">最终总战力</div>
                        <div class="poster-score-num" id="final-score">0</div>
                    </div>
                </div>
                <div class="poster-role-tag" id="max-role-tag">解锁最高形态：-</div>
                <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; white-space: nowrap;">
                    <img src="avatar-logo.png" alt="Logo" style="width: 30px; height: 30px; object-fit: contain; border-radius: 50%; border: 1.5px solid #FAD6A5;">
                    <div class="poster-footer">演员谢苗超话制作</div>
                </div>
            </div>

            <div class="mobile-poster-box" id="mobile-poster-box">
                <img id="final-poster-img" src="" alt="专属战绩卡">
                <div class="save-tip">👇 长按上方图片即可保存到相册 👇</div>
            </div>

            <div class="btn-group">
                <button class="btn-core btn-orange" id="gen-poster-btn" onclick="generatePoster()">📸 生成专属成绩单</button>
                <button class="btn-core btn-pink" onclick="location.reload()">再玩一次 🔁</button>
            </div>
        </div>
    </div>
</div>

<!-- 拖拽时屏幕跟随的虚拟道具 -->
<div id="ghost-tool">
    <div id="ghost-tool-indicator"></div>
    <span id="ghost-tool-icon"></span>
</div>

<script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let bgmStarted = false;
    let userToggledBgm = false; 
    let motionInitialized = false;
    
    // 状态控制
    let isPaused = false;
    let bombCount = 0;
    let shakeCount = 3;
    let currentDragTool = null; // 'bomb' or 'shake'
    
    // 蓄力参数
    let minBlastRadius = 20; 
    let maxBlastRadius = 60; 
    let currentBlastRadius = 20;
    let growTimer = null;
    let fuseOscNode = null;
    let fuseGainNode = null;

    const bgmToggle = document.getElementById('bgm-toggle');
    const pauseToggle = document.getElementById('pause-toggle');
    const bgm = document.getElementById('bgm');
    const pauseMask = document.getElementById('pause-mask');
    
    const bombContainer = document.getElementById('bomb-container');
    const bombCountEl = document.getElementById('bomb-count');
    const shakeContainer = document.getElementById('shake-container');
    const shakeCountEl = document.getElementById('shake-count');
    
    const ghostTool = document.getElementById('ghost-tool');
    const ghostIcon = document.getElementById('ghost-tool-icon');
    const ghostInd = document.getElementById('ghost-tool-indicator');
    
    const loadBtn = document.getElementById('load-btn');
    const saveToast = document.getElementById('save-toast');

    bgmToggle.addEventListener('click', (e) => {
        e.stopPropagation(); 
        if (bgm.paused) {
            bgm.volume = 0.25;
            bgm.play();
            bgmToggle.innerText = '🎵';
            bgmToggle.classList.remove('bgm-paused');
            bgmToggle.classList.add('bgm-playing');
            userToggledBgm = false;
        } else {
            bgm.pause();
            bgmToggle.innerText = '🔇';
            bgmToggle.classList.add('bgm-paused');
            bgmToggle.classList.remove('bgm-playing');
            userToggledBgm = true;
        }
        bgmStarted = true; 
    });

    // ========== 存档与读档系统 ==========
    function getSaves() {
        let saves = localStorage.getItem('miaoGeSaves');
        return saves ? JSON.parse(saves) : {};
    }

    function updateLoadButtonState() {
        const saves = getSaves();
        if (Object.keys(saves).length > 0) {

    function confirmLoad(name) {
        const saves = getSaves();
        const data = saves[name];
        if(!data) return;

        const activeBodies = Composite.allBodies(engine.world).filter(b => b.roleInfo && !b.isStatic);
        Composite.remove(engine.world, activeBodies);
        
        score = data.score || 0;
        highestLevel = data.highestLevel || 0;
        bombCount = data.bombCount || 0;
        shakeCount = (data.shakeCount !== undefined) ? data.shakeCount : 3;
        currentDropLevel = data.currentDropLevel || 0;
        
        scoreEl.innerText = score;
        updateBombUI();
        updateShakeUI();
        
        const info = ROLES[currentDropLevel];
        previewEl.style.width = (info.radius * 2) + 'px';
        previewEl.style.height = (info.radius * 2) + 'px';
        const img = roleImages[currentDropLevel];
        if (img && img.src && img.complete && img.naturalWidth !== 0) {
            previewEl.style.backgroundImage = `url('${img.src}')`;
            previewEl.innerText = "";
        } else {
            previewEl.style.backgroundImage = "none";
            previewEl.innerText = info.name;
            previewEl.style.fontSize = Math.max(11, Math.round(info.radius * 0.32)) + 'px';
        }
        updatePreviewPos(width / 2);
        
        const restoredBodies = data.bodies.map(d => {
            const rInfo = ROLES[d.level];
            const circle = Bodies.circle(d.x, d.y, rInfo.radius, {
                angle: d.angle, restitution: 0.05, friction: 0.01, density: 0.005, render: { visible: false }
            });
            Matter.Body.setVelocity(circle, { x: d.vx, y: d.vy });
            circle.roleInfo = rInfo;
            return circle;
        });
        Composite.add(engine.world, restoredBodies);
        
        backToPause();
        togglePause();
    }

    function updateToolIndicator() {
        ghostInd.style.width = (currentBlastRadius * 2) + 'px';
        ghostInd.style.height = (currentBlastRadius * 2) + 'px';
    }

    function startDragTool(type, e) {
        if (isGameOver || isPaused) return;
        if (type === 'bomb' && bombCount <= 0) return;
        if (type === 'shake' && shakeCount <= 0) return;
        
        e.preventDefault(); e.stopPropagation();
        currentDragTool = type;
        
        minBlastRadius = ROLES[0].radius;
        maxBlastRadius = ROLES[7].radius;
        currentBlastRadius = minBlastRadius; 
        
        if (type === 'bomb') {
            ghostIcon.innerText = '💣';
            ghostInd.style.borderColor = '#FF334B';
            ghostInd.style.background = 'radial-gradient(circle, rgba(255,51,75,0.4) 0%, rgba(255,51,75,0.1) 100%)';
        } else {
            ghostIcon.innerText = '🌀';
            ghostInd.style.borderColor = '#4169E1';
            ghostInd.style.background = 'radial-gradient(circle, rgba(65,105,225,0.4) 0%, rgba(65,105,225,0.1) 100%)';
        }
        
        ghostTool.style.display = 'block';
        updateGhostToolPos(e);
        updateToolIndicator();

        startFuseSound();

        // 蓄力循环变大
        growTimer = setInterval(() => {
            currentBlastRadius += 0.8; 
            if (currentBlastRadius > maxBlastRadius) {
                currentBlastRadius = minBlastRadius; 
            }
            updateToolIndicator();
        }, 20);

        document.addEventListener('mousemove', moveDragTool);
        document.addEventListener('touchmove', moveDragTool, {passive: false});
        document.addEventListener('mouseup', endDragTool);
        document.addEventListener('touchend', endDragTool);
    }

    function updateGhostToolPos(e) {
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        ghostTool.style.left = x + 'px';
        ghostTool.style.top = y + 'px';
    }

    function moveDragTool(e) {
        if (!currentDragTool) return;
        e.preventDefault(); e.stopPropagation();
        updateGhostToolPos(e);
    }

    function endDragTool(e) {
        if (!currentDragTool) return;
        const toolType = currentDragTool;
        currentDragTool = null;
        ghostTool.style.display = 'none';
        
        clearInterval(growTimer);
        stopFuseSound();

        document.removeEventListener('mousemove', moveDragTool);
        document.removeEventListener('touchmove', moveDragTool);
        document.removeEventListener('mouseup', endDragTool);
        document.removeEventListener('touchend', endDragTool);

        let x, y;
        if (e.changedTouches) {
            x = e.changedTouches[0].clientX;
            y = e.changedTouches[0].clientY;
        } else {
            x = e.clientX;
            y = e.clientY;
        }

        const box = wrapper.getBoundingClientRect();
        if (x >= box.left && x <= box.right && y >= box.top && y <= box.bottom) {
            const localX = x - box.left;
            const localY = y - box.top;
            if (toolType === 'bomb') {
                executeBomb(localX, localY, currentBlastRadius);
            } else if (toolType === 'shake') {
                executeShake(localX, localY, currentBlastRadius);
            }
        }
    }

    function executeBomb(x, y, radius) {
        bombCount--;
        updateBombUI();
        
        const bodies = Composite.allBodies(engine.world);
        const toRemove = [];
        
        bodies.forEach(b => {
            if (b.roleInfo && !b.isStatic) {
                const dist = Matter.Vector.magnitude(Matter.Vector.sub(b.position, {x, y}));
                if (dist < radius + b.roleInfo.radius) {
                    toRemove.push(b);
                    score += (b.roleInfo.level + 1) * 2; 
                }
            }
        });
        
        Composite.remove(engine.world, toRemove);
        scoreEl.innerText = score;
        playSoundEffect('bombExplode');

        const wave = document.createElement('div');
        wave.style.position = 'absolute';
        wave.style.left = `${x}px`;
        wave.style.top = `${y}px`;
        wave.style.width = '0px';
        wave.style.height = '0px';
        wave.style.borderRadius = '50%';
        wave.style.background = 'radial-gradient(circle, rgba(255,51,75,0.8) 0%, rgba(255,160,122,0) 70%)';
        wave.style.transform = 'translate(-50%, -50%)';
        wave.style.zIndex = '20';
        wave.style.pointerEvents = 'none';
        wave.style.transition = 'all 0.3s cubic-bezier(0.1, 0.8, 0.3, 1)';
        wrapper.appendChild(wave);

        requestAnimationFrame(() => {
            wave.style.width = `${radius * 2.2}px`;
            wave.style.height = `${radius * 2.2}px`;
            wave.style.opacity = '0';
        });

        wrapper.classList.add('shake');
        setTimeout(() => { wrapper.classList.remove('shake'); wave.remove(); }, 300);
    }

    // 局部重组核心逻辑：仅打乱指定范围内球体的位置坐标
    function executeShake(x, y, radius) {
        shakeCount--;
        updateShakeUI();
        
        const bodies = Composite.allBodies(engine.world);
        const targets = [];
        
        bodies.forEach(b => {
            if (b.roleInfo && !b.isStatic) {
                const dist = Matter.Vector.magnitude(Matter.Vector.sub(b.position, {x, y}));
                if (dist < radius + b.roleInfo.radius) {
                    targets.push(b);
                }
            }
        });

        if (targets.length > 1) {
            // 提取坐标并洗牌
            const positions = targets.map(b => ({ x: b.position.x, y: b.position.y }));
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }
            // 重新赋予新坐标，并重置速度防止乱弹
            targets.forEach((b, i) => {
                Matter.Body.setPosition(b, positions[i]);
                Matter.Body.setVelocity(b, {x: 0, y: 0});
                Matter.Body.setAngularVelocity(b, 0);
            });
        }
        
        playSoundEffect('reorganize');

        // 蓝色魔力波纹
        const wave = document.createElement('div');
        wave.style.position = 'absolute';
        wave.style.left = `${x}px`;
        wave.style.top = `${y}px`;
        wave.style.width = '0px';
        wave.style.height = '0px';
        wave.style.borderRadius = '50%';
        wave.style.background = 'radial-gradient(circle, rgba(65,105,225,0.8) 0%, rgba(65,105,225,0) 70%)';
        wave.style.transform = 'translate(-50%, -50%)';
        wave.style.zIndex = '20';
        wave.style.pointerEvents = 'none';
        wave.style.transition = 'all 0.3s cubic-bezier(0.1, 0.8, 0.3, 1)';
        wrapper.appendChild(wave);

        requestAnimationFrame(() => {
            wave.style.width = `${radius * 2.2}px`;
            wave.style.height = `${radius * 2.2}px`;
            wave.style.opacity = '0';
        });

        setTimeout(() => { wave.remove(); }, 300);
    }

    // ========== 音效系统 ==========
    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startFuseSound() {
        initAudio();
        fuseOscNode = audioCtx.createOscillator();
        fuseGainNode = audioCtx.createGain();
        fuseOscNode.type = 'sawtooth';
        fuseOscNode.frequency.setValueAtTime(200, audioCtx.currentTime);
        fuseOscNode.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 2.5); 
        
        fuseGainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        
        fuseOscNode.connect(fuseGainNode);
        fuseGainNode.connect(audioCtx.destination);
        fuseOscNode.start();
    }

    function stopFuseSound() {
        if (fuseOscNode) {
            fuseOscNode.stop();
            fuseOscNode.disconnect();
            fuseOscNode = null;
        }
    }

    function playSoundEffect(type, comboLevel = 1) {
        initAudio();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'drop') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.05); 
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'correct') {
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'combo') {
            oscillator.type = 'sine';
            const baseFreq = 600 + (comboLevel * 80); 
            oscillator.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'triumph') {
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
            oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'bombExplode') {
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            noiseFilter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);

            const nGain = audioCtx.createGain();
            nGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            nGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            noise.connect(noiseFilter);
            noiseFilter.connect(nGain);
            nGain.connect(audioCtx.destination);
            noise.start();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'reorganize') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    const roleImages = [];

                `./images/role${num}.png`,`./images/role${num}.jpg`,`./images/role${num}.jpeg`,`./images/role${num}.jfif`,`./images/role${num}.webp`,

            ];
            let attempt = 0;
            img.onerror = () => {
                attempt++;
                if (attempt < candidatePaths.length) {

    const wallThick = 60;
    const ground = Bodies.rectangle(width / 2, height + wallThick / 2, width * 2, wallThick, { isStatic: true, friction: 0.8, render: { visible: false } });
    const leftWall = Bodies.rectangle(-wallThick / 2, height / 2, wallThick, height * 2, { isStatic: true, friction: 0.8, render: { visible: false } });
    const rightWall = Bodies.rectangle(width + wallThick / 2, height / 2, wallThick, height * 2, { isStatic: true, friction: 0.8, render: { visible: false } });

        const bodies = Composite.allBodies(engine.world);

        bodies.forEach(body => {
            if (body.roleInfo) {
                const { x, y } = body.position;
                const r = body.roleInfo.radius;
                const img = roleImages[body.roleInfo.level];

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(body.angle);
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.clip();

                if (img && img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, -r, -r, r * 2, r * 2);
                } else {
                    ctx.fillStyle = "#FFE4C4";
                    ctx.fill();
                    const calculatedFontSize = Math.max(12, Math.round(r * 0.32));
                    ctx.fillStyle = "#5C4033";
                    ctx.font = `900 ${calculatedFontSize}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 3;
                    ctx.strokeText(body.roleInfo.name, 0, 0);
                    ctx.fillText(body.roleInfo.name, 0, 0);
                }
                ctx.restore();
                ctx.save();
                ctx.translate(x, y);
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.lineWidth = body.roleInfo.level >= 13 ? 4 : 2.5;
                ctx.strokeStyle = body.roleInfo.level >= 13 ? '#FF8C00' : '#D2691E';
                ctx.stroke();
                ctx.restore();
            }
        });
    });

    function setupNextDrop() {
        // 降低难度：大幅度提升后期掉落大球的概率
        let maxDropLevel = 3; 
        if (score > 300) maxDropLevel = 4;
        if (highestLevel >= 5) maxDropLevel = 5;
        if (highestLevel >= 7) maxDropLevel = 6;
        if (highestLevel >= 9) maxDropLevel = 7;
        if (highestLevel >= 11) maxDropLevel = 8; 
        if (highestLevel >= 13) maxDropLevel = 9; 

        currentDropLevel = Math.floor(Math.random() * maxDropLevel);
        const info = ROLES[currentDropLevel];
        const r = info.radius;

        previewEl.style.width = (r * 2) + 'px';
        previewEl.style.height = (r * 2) + 'px';

        const img = roleImages[currentDropLevel];
        if (img && img.src && img.complete && img.naturalWidth !== 0) {
            previewEl.style.backgroundImage = `url('${img.src}')`;
            previewEl.innerText = "";
        } else {
            previewEl.style.backgroundImage = "none";
            previewEl.style.backgroundColor = "#FFE4C4";
            previewEl.innerText = info.name;
            previewEl.style.fontSize = Math.max(11, Math.round(r * 0.32)) + 'px';
        }

        updatePreviewPos(currentX);
    }

    function updatePreviewPos(x) {
        const r = ROLES[currentDropLevel].radius;
        const clampedX = Math.max(r + 2, Math.min(width - r - 2, x));
        currentX = clampedX;
        previewEl.style.left = clampedX + 'px';
    }

    function dropRole() {
        if (!canDrop || isGameOver || isPaused || currentDragTool) return;
        canDrop = false;

        const info = ROLES[currentDropLevel];
        const circle = Bodies.circle(currentX, height * 0.05, info.radius, {
            restitution: 0.02, // 极低的弹力，防乱弹
            friction: 0.005,   // 极低的摩擦力，极其丝滑
            density: 0.005,
            render: { visible: false }
        });
        circle.roleInfo = info;
        Composite.add(engine.world, circle);

        playSoundEffect('drop');
        previewEl.style.display = 'none';

        setTimeout(() => {
            if (!isGameOver && !isPaused) {
                setupNextDrop();
                previewEl.style.display = 'flex';
                canDrop = true;
            }
        }, 500);
    }

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach(pair => {
            const bodyA = pair.bodyA;
            const bodyB = pair.bodyB;

            if (bodyA.roleInfo && bodyB.roleInfo) {
                if (bodyA.roleInfo.level === bodyB.roleInfo.level) {
                    const nextLevel = bodyA.roleInfo.level + 1;
                    if (nextLevel < ROLES.length && !bodyA.isRemoved && !bodyB.isRemoved) {
                        bodyA.isRemoved = true;
                        bodyB.isRemoved = true;

                        const midX = (bodyA.position.x + bodyB.position.x) / 2;
                        const midY = (bodyA.position.y + bodyB.position.y) / 2;
                        const nextInfo = ROLES[nextLevel];

                        Composite.remove(engine.world, [bodyA, bodyB]);

                        const newCircle = Bodies.circle(midX, midY, nextInfo.radius, {
                            restitution: 0.02,
                            friction: 0.005,
                            density: 0.005,
                            render: { visible: false }
                        });
                        newCircle.roleInfo = nextInfo;
                        Composite.add(engine.world, newCircle);

                        if (nextLevel >= 10) {
                            wrapper.classList.add('shake');
                            setTimeout(() => wrapper.classList.remove('shake'), 160);
                        }

                        if (nextLevel > highestLevel) {
                            highestLevel = nextLevel;
                            bombCount++;
                            updateBombUI();
                        }

                        score += (nextLevel + 1) * 3;
                        scoreEl.innerText = score;

                        if (nextLevel >= 13) playSoundEffect('triumph');
                        else playSoundEffect('correct');

                        triggerComboPopup(midX, midY);
                    }
                }
            }
        });
    });

    // 降低警戒线判定（留出更多顶部道具操作空间）
    const DANGER_Y = height * 0.08; 
    setInterval(() => {
        if (isGameOver || isPaused) return;
        const bodies = Composite.allBodies(engine.world);
        bodies.forEach(b => {
            if (b.roleInfo && (b.position.y - b.roleInfo.radius < DANGER_Y)) {
                if (Math.abs(b.velocity.y) < 0.2 && Math.abs(b.velocity.x) < 0.2 && b.position.y > (height * 0.06)) {
                    triggerGameOver();
                }
            }
        });
    }, 1000);

    function triggerGameOver() {
        isGameOver = true;
        previewEl.style.display = 'none';
        document.getElementById('tools-container').style.display = 'none';
        finalScoreEl.innerText = score;
        maxRoleTag.innerText = `解锁最高形态：${ROLES[highestLevel].year} · ${ROLES[highestLevel].name}`;
        gameOverMask.style.display = 'flex';
    }

    function generatePoster() {
        const captureArea = document.getElementById('capture-area');
        const mobilePosterBox = document.getElementById('mobile-poster-box');
        const finalPosterImg = document.getElementById('final-poster-img');
        const genBtn = document.getElementById('gen-poster-btn');

        html2canvas(captureArea, {
            scale: 3,
            backgroundColor: "#FFF5E1",
            width: captureArea.offsetWidth,
            height: captureArea.offsetHeight,
            useCORS: true
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            finalPosterImg.src = imgData;
            captureArea.style.display = 'none';
            genBtn.style.display = 'none';
            mobilePosterBox.style.display = 'flex';
        });
    }

    function handlePointerCoord(e) {
        if (isPaused || currentDragTool) return;
        const box = wrapper.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        updatePreviewPos(clientX - box.left);
    }

    wrapper.addEventListener('touchstart', (e) => { 
        if(!currentDragTool) { startBGMAndMotion(); handlePointerCoord(e); }
    }, { passive: true });
    wrapper.addEventListener('touchmove', (e) => { 
        if (canDrop && !isPaused && !currentDragTool) handlePointerCoord(e); 
    }, { passive: true });
    wrapper.addEventListener('touchend', () => { 
        if(!currentDragTool) dropRole(); 
    });

    wrapper.addEventListener('mousedown', (e) => { 
        if(!currentDragTool) { startBGMAndMotion(); handlePointerCoord(e); }
    });
    wrapper.addEventListener('mousemove', (e) => { 
        if (canDrop && !isPaused && !currentDragTool) handlePointerCoord(e); 
    });
    wrapper.addEventListener('mouseup', () => { 
        if(!currentDragTool) dropRole(); 
    });

    setupNextDrop();
</script>

</body>
