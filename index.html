<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>开心苗苗乐·演员谢苗超话制作</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin: 0; padding: 0; }
        
        html, body {
            width: 100%; height: 100%; height: 100dvh; overflow: hidden;
            background-color: #FFF8EA; color: #5C4033; font-family: 'PingFang SC', sans-serif;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(#FAD6A5 10%, transparent 11%); background-size: 30px 30px;
        }

        /* ===== 动态效果引导页样式 ===== */
        #intro-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #FFF5E1 0%, #FFEFD5 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 99999; text-align: center; padding: 20px; transition: opacity 0.5s ease-out;
        }
        .intro-content {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            animation: introBounce 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes introBounce {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .intro-title-1 {
            font-size: 34px; font-weight: 900; color: #D2691E; letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(210, 105, 30, 0.2);
        }
        .intro-title-2 {
            display: flex; align-items: center; gap: 10px; font-size: 16px; color: #8B5A2B; font-weight: bold;
            background: rgba(255, 255, 255, 0.5); padding: 6px 18px; border-radius: 30px; border: 2px solid #FAD6A5;
        }
        .intro-title-2 img { width: 32px; height: 32px; object-fit: contain; border-radius: 50%; border: 1px solid #DEB887; }
        .intro-title-3 {
            font-size: 12px; color: #CD853F; font-weight: bold; letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.6); padding: 4px 14px; border-radius: 20px; border: 1px dashed #DEB887;
        }
        .intro-enter-btn {
            margin-top: 15px; padding: 12px 36px; background-color: #3CB371; color: white;
            font-size: 18px; font-weight: 900; border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 6px 0 #2E8B57, 0 10px 20px rgba(60, 179, 113, 0.3); transition: transform 0.1s, box-shadow 0.1s;
            animation: pulseBtn 2s infinite; pointer-events: auto;
        }
        .intro-enter-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2E8B57; }
        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #arcade-container {
            width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column;
            background-color: #FFFFFF; border-left: 4px solid #FAD6A5; border-right: 4px solid #FAD6A5;
            box-shadow: 0 10px 25px rgba(200, 180, 160, 0.5); position: relative; overflow: hidden;
        }

        /* 顶部看板 */
        .top-bar {
            width: 100%; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;
            background: #FFEFD5; border-bottom: 3px solid #DEB887; z-index: 20; flex-shrink: 0;
        }
        .header-layout { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        .logo-img { width: 34px; height: 34px; object-fit: contain; mix-blend-mode: multiply; }
        .title-group h1 { font-size: 15px; color: #D2691E; font-weight: 900; margin: 0; line-height: 1.2; }
        .subtitle { font-size: 9px; color: #8B5A2B; font-weight: bold; margin-top: 1px; }
        
        .icon-btn {
            width: 28px; height: 28px; background: rgba(255, 255, 255, 0.9); border: 2px solid #DEB887; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 12px; cursor: pointer; box-shadow: 0 2px 5px rgba(210, 105, 30, 0.15); flex-shrink: 0;
        }
        .icon-btn:active { transform: scale(0.9); }
        .score-board { text-align: right; background: #FFFFFF; padding: 2px 6px; border-radius: 10px; border: 2px dashed #DEB887; flex-shrink: 0; }
        .score-label { font-size: 9px; color: #FF9800; font-weight: 900; }
        .score-val { font-size: 15px; font-weight: 900; color: #FF9800; font-family: 'Arial Black', sans-serif; line-height: 1.1; }

        /* 顶部舞台区 */
        #top-stage {
            height: 18%; width: 100%; position: relative; z-index: 10; flex-shrink: 0;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            background-color: #FFFDF9; background-image: url('images/stage_bg.jpg'); background-size: cover; background-position: center; border-bottom: 3px solid #DEB887;
        }
        #character-avatar {
            width: 100px; height: 100px; z-index: 2; transform-origin: bottom center; margin-bottom: -10px; 
            background-size: contain; background-repeat: no-repeat; background-position: bottom center; font-size: 70px; display: flex; justify-content: center; align-items: flex-end; transition: transform 0.3s;
        }
        #desk {
            width: 100%; height: 36px; z-index: 3; display: flex; justify-content: center; align-items: flex-start;
            background-color: #DEB887; background-image: url('images/desk_bar.png'); background-size: cover; background-position: center; border-top: 3px solid #CD853F; border-bottom: 2px solid #5C4033;
        }
        #desk-prop { width: 36px; height: 36px; margin-top: -18px; font-size: 20px; display: flex; justify-content: center; align-items: center; background-size: contain; background-repeat: no-repeat; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }

        /* 消除区 */
        #game-wrapper {
            position: relative; width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; padding: 6px; background: #FFFDF9; box-shadow: inset 0 0 15px rgba(222, 184, 135, 0.3);
        }
        #grid-container {
            position: relative; background: rgba(255, 255, 255, 0.9); border: 4px solid #DEB887; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(200, 180, 160, 0.4); transition: filter 0.3s;
        }
        .bg-cell { position: absolute; border: 1px solid rgba(222, 184, 135, 0.15); }
        .bg-cell.light { background-color: rgba(255, 248, 234, 0.7); }
        .bg-cell.dark { background-color: rgba(250, 214, 165, 0.4); }

        .tile {
            position: absolute; display: flex; justify-content: center; align-items: center; font-size: 22px;
            will-change: top, left, transform; cursor: pointer; z-index: 10; 
            background-size: contain; background-repeat: no-repeat; background-position: center;
        }
        .tile::after { content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; opacity: 0.9; z-index: 12; background-size: cover;}
        .tile.effect-row::after { background-image: url('images/eff_row.png'); background-color: rgba(210,105,30,0.3); }
        .tile.effect-col::after { background-image: url('images/eff_col.png'); background-color: rgba(210,105,30,0.3); }
        .tile.effect-cross::after { background-image: url('images/eff_cross.png'); background-color: rgba(255,152,0,0.5); border-radius: 50%;}
        .tile.selected { transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(210, 105, 30, 0.8)); z-index: 20; }
        .tile.matched { animation: popOut 0.25s forwards; }
        @keyframes popOut { 50% { transform: scale(1.3); opacity: 0.8; } 100% { transform: scale(0); opacity: 0; } }
        .blast-wave { position: absolute; background: #FFA07A; opacity: 0.8; z-index: 15; pointer-events: none; transition: all 0.3s ease-out; }

        /* 拖动道具跟随层 */
        #ghost-tool { display: none; position: fixed; font-size: 32px; z-index: 9999; pointer-events: none; transform: translate(-50%, -50%); }
        #ghost-tool-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed; z-index: -1; }

        /* Combo 飘字动画 */
        .combo-text {
            position: absolute; font-weight: 900; color: #FFFDF9;
            text-shadow: -1px -1px 0 #D2691E, 1px -1px 0 #D2691E, -1px 1px 0 #D2691E, 1px 1px 0 #D2691E, 0 0 12px #FFB6C1, 0 0 22px #FAD6A5;
            pointer-events: none; z-index: 30; white-space: nowrap; animation: comboFly 0.8s ease-out forwards;
        }
        @keyframes comboFly {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            20% { opacity: 1; transform: translate(-50%, -70%) scale(1.2); }
            70% { opacity: 1; transform: translate(-50%, -100%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -130%) scale(0.8); }
        }

        /* 底部道具区 */
        #bottom-tools {
            height: 11%; width: 100%; background: #FFEFD5; border-top: 3px solid #DEB887; display: flex; justify-content: space-evenly; align-items: center; padding: 0 8px; flex-shrink: 0;
        }
        .tool-btn {
            background: rgba(255, 255, 255, 0.95); border-radius: 10px; padding: 4px 10px; display: flex; align-items: center; gap: 4px; cursor: pointer; transition: all 0.2s; border: 2px solid #DEB887; box-shadow: 0 3px 6px rgba(200, 180, 160, 0.3);
        }
        .tool-btn:active { transform: scale(0.95); }
        .tool-btn.disabled { opacity: 0.5; pointer-events: none; filter: grayscale(100%); }
        .tool-count { font-size: 12px; font-weight: 900; white-space: nowrap; pointer-events: none; }
        #hammer-tool { border-color: #3CB371; color: #3CB371; }
        #bomb-tool { border-color: #FF334B; color: #FF334B; }
        #refresh-tool { border-color: #4169E1; color: #4169E1; }

        /* 系统菜单 & 海报 */
        #settings-mask, #poster-mask {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 248, 234, 0.95); backdrop-filter: blur(4px); flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .settings-box { background: #FFF5E1; border: 4px solid #FAD6A5; border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(200, 180, 160, 0.4); max-height: 85%; overflow-y: auto; }
        .settings-title { font-size: 20px; font-weight: 900; color: #D2691E; margin-bottom: 15px; }
        .settings-btn { width: 100%; padding: 10px; margin-bottom: 10px; border: none; border-radius: 20px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.2s; }
        .settings-btn:active { transform: translateY(2px); }
        .btn-green { background-color: #3CB371; box-shadow: 0 4px 0 #2E8B57; } .btn-blue { background-color: #4169E1; box-shadow: 0 4px 0 #27408B; } .btn-pink { background-color: #FFB6C1; box-shadow: 0 4px 0 #FF69B4; }
        #save-list-container { margin: 15px 0; border: 2px dashed #DEB887; border-radius: 10px; padding: 10px; background: #FFFFFF; min-height: 80px; max-height: 200px; overflow-y: auto; }
        .save-item { background: #FFEFD5; border: 1px solid #DEB887; padding: 8px; margin-bottom: 8px; border-radius: 8px; font-size: 13px; color: #D2691E; font-weight: bold; cursor: pointer; }
        .save-item:active { background: #FFE4C4; } .save-hint { font-size: 11px; color: #CD853F; margin-top: -5px; margin-bottom: 10px; font-weight: bold; }

        #capture-area { width: 90%; max-width: 360px; background: #FFF5E1; border: 4px solid #FAD6A5; border-radius: 20px; display: flex; flex-direction: column; align-items: center; padding: 20px 12px; box-shadow: 0 10px 25px rgba(200, 180, 160, 0.4); }
        .poster-header-pill { display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-radius: 30px; padding: 4px 10px; border: 2px solid #FAD6A5; margin-bottom: 10px; width: 100%; }
        .poster-badge { font-size: 13px; color: #8B5A2B; font-weight: 900; margin: 0 8px; white-space: nowrap; }
        .poster-title { font-size: 22px; font-weight: 900; color: #D2691E; margin-bottom: 8px; letter-spacing: 1px; }
        .poster-score-box { background: #FFFFFF; border: 2px dashed #DEB887; padding: 8px 15px; border-radius: 12px; text-align: center; margin: 8px 0; width: 100%; }
        .poster-score-num { font-size: 32px; color: #D2691E; font-weight: 900; line-height: 1; margin-top: 4px; }
        .poster-role-tag { font-size: 13px; font-weight: 900; color: #D2691E; margin-top: 6px; padding: 5px 14px; background: #FFF0F5; border-radius: 15px; border: 2px dotted #FFB6C1; }
        .save-tip { font-size: 13px; color: #D2691E; font-weight: 900; margin-top: 15px; background: #FFEFD5; padding: 6px 16px; border-radius: 15px; border: 2px dashed #DEB887; }
        #final-poster-img { width: 90%; max-width: 360px; border-radius: 20px; border: 4px solid #FAD6A5; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: none; }
        .btn-close-poster { margin-top: 15px; padding: 10px 30px; background: #FFB6C1; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; color: white; box-shadow: 0 4px 0 #FF69B4; cursor: pointer; } .btn-close-poster:active { transform: translateY(4px); box-shadow: none; }
        #toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(210,105,30,0.9); color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    </style>
</head>
<body>
<div id="toast">提示信息</div>

<!-- ===== 动态效果引导页（绑定直接点击和按钮触发） ===== -->
<div id="intro-mask" onclick="enterGame()">
    <div class="intro-content">
        <div class="intro-title-1">开心苗苗乐</div>
        <div class="intro-title-2">
            <img src="images/avatar-logo.png" alt="logo" onerror="this.style.display='none'">
            <span>演员超话制作</span>
        </div>
        <div class="intro-title-3">制作：林科森 | 制图：老周</div>
        <button class="intro-enter-btn" onclick="enterGame(event)">点击进入</button>
    </div>
</div>

<div id="ghost-tool">
    <div id="ghost-tool-indicator"></div>
    <span id="ghost-tool-icon">🔨</span>
</div>

<div id="arcade-container">
    <div class="top-bar">
        <div class="header-layout">
            <img src="images/gonggu.png" alt="巩固" class="logo-img" onerror="this.style.display='none'">
            <div class="title-group">
                <h1>开心苗苗乐</h1>
                <div class="subtitle">演员谢苗超话制作</div>
            </div>
        </div>
        <div class="header-layout">
            <div id="bgm-toggle" class="icon-btn">🔇</div>
            <div id="settings-toggle" class="icon-btn">⚙️</div>
            <div id="camera-toggle" class="icon-btn" style="background:#FFE4E1; border-color:#FFB6C1;">📸</div>
            <div class="score-board">
                <div class="score-label">总战力</div>
                <div class="score-val" id="score">0</div>
            </div>
            <img src="images/xiemiao.png" alt="谢苗" class="logo-img" onerror="this.style.display='none'">
        </div>
    </div>

    <div id="top-stage">
        <div id="character-avatar" style="background-image: url('images/avatar_1.png');">👦</div>
        <div id="desk"><div id="desk-prop" style="background-image: url('images/prop_1.png');">🍵</div></div>
    </div>

    <div id="game-wrapper"><div id="grid-container"></div></div>

    <div id="bottom-tools">
        <div class="tool-btn" id="hammer-tool"><span class="tool-icon">🔨</span><span class="tool-count" id="count-hammer">单点 × 5</span></div>
        <div class="tool-btn" id="bomb-tool"><span class="tool-icon">💣</span><span class="tool-count" id="count-bomb">炸弹 × 5</span></div>
        <div class="tool-btn" id="refresh-tool"><span class="tool-icon">🌀</span><span class="tool-count" id="count-refresh">刷新 × 5</span></div>
    </div>

    <div id="settings-mask">
        <div class="settings-box">
            <div class="settings-title">系统菜单</div>
            <button class="settings-btn btn-green" onclick="saveGame()">💾 记录当前进度</button>
            <div style="text-align: left; margin-top: 15px; color: #8B5A2B; font-weight: 900; font-size: 14px;">本地存档：</div>
            <div class="save-hint">※ 点击读取，长按删除</div>
            <div id="save-list-container"></div>
            <button class="settings-btn btn-blue" onclick="restartGame()">🔄 重新开始</button>
            <button class="settings-btn btn-pink" onclick="closeSettings()">返回游戏</button>
        </div>
    </div>

    <div id="poster-mask">
        <div id="capture-area">
            <div class="poster-header-pill">
                <img src="images/gonggu.png" alt="" style="width: 28px; height: 28px; object-fit: contain; mix-blend-mode: multiply;" onerror="this.style.display='none'">
                <div class="poster-badge">✨ 苗友成绩单 ✨</div>
                <img src="images/xiemiao.png" alt="" style="width: 28px; height: 28px; object-fit: contain; mix-blend-mode: multiply;" onerror="this.style.display='none'">
            </div>
            <div class="poster-title">开心苗苗乐</div>
            <div id="poster-avatar-preview" style="width: 90px; height: 90px; background-size: contain; background-repeat: no-repeat; background-position: center; font-size: 60px; text-align: center; line-height: 90px;">👦</div>
            <div class="poster-role-tag" id="poster-role-text">已解锁：第一阶段·洪文定</div>
            <div class="poster-score-box">
                <div style="font-size: 13px; color: #8B5A2B; font-weight: bold;">历史最高战力</div>
                <div class="poster-score-num" id="poster-score">0</div>
            </div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; font-size: 12px; color: #CD853F; font-weight: bold;">
                <img src="images/avatar-logo.png" style="width: 22px; height: 22px; object-fit: contain; border-radius: 50%; border: 1px solid #FAD6A5;" onerror="this.style.display='none'"> 
                <span>演员谢苗超话制作</span>
            </div>
        </div>
        <img id="final-poster-img" src="">
        <div class="save-tip" id="save-tip-text">正在生成海报...</div>
        <button class="btn-close-poster" onclick="closePoster()">返回游戏</button>
    </div>
</div>

<audio id="bgm" src="audio/bgm.mp3" loop preload="auto"></audio>

<script>
    // 点击进入游戏引导页
    function enterGame(e) {
        if (e) e.stopPropagation();
        const mask = document.getElementById('intro-mask');
        if (!mask) return;
        mask.style.opacity = '0';
        setTimeout(() => {
            mask.style.display = 'none';
        }, 500);
        
        // 尝试自动播放背景音乐
        const bgm = document.getElementById('bgm');
        if(bgm && bgm.paused) {
            bgm.play().catch(err => console.log('BGM auto-play blocked'));
            const btn = document.getElementById('bgm-toggle');
            if(btn) {
                btn.innerText = '🎵';
                btn.classList.add('bgm-playing');
            }
        }
    }

    const ROWS = 9, COLS = 9; let TILE_SIZE = 40;
    const TYPES = ['🥋', '🕶️', '🗡️', '👊', '🧨', '📿', '🍶']; 
    const EVOLUTION = [
        { score: 0,     name: "第一阶段：洪文定", avatar: "url('images/avatar_1.png')", fallback: "👦", prop: "url('images/prop_1.png')", propFallback: "🍵" },
        { score: 300,   name: "第二阶段：海远",   avatar: "url('images/avatar_2.png')", fallback: "🧑", prop: "url('images/prop_2.png')", propFallback: "🥢" },
        { score: 800,   name: "第三阶段：巩固",   avatar: "url('images/avatar_3.png')", fallback: "👨", prop: "url('images/prop_3.png')", propFallback: "🎒" },
        { score: 1500,  name: "第四阶段：惠忍",   avatar: "url('images/avatar_4.png')", fallback: "🦲", prop: "url('images/prop_4.png')", propFallback: "📿" },
        { score: 2500,  name: "第五阶段：韩晓峰", avatar: "url('images/avatar_5.png')", fallback: "🧥", prop: "url('images/prop_5.png')", propFallback: "📱" },
        { score: 4000,  name: "第六阶段：李红旗", avatar: "url('images/avatar_6.png')", fallback: "👮", prop: "url('images/prop_6.png')", propFallback: "🚔" },
        { score: 6500,  name: "第七阶段：成瞎子", avatar: "url('images/avatar_7.png')", fallback: "🦯", prop: "url('images/prop_7.png')", propFallback: "🍶" },
        { score: 9500,  name: "第八阶段：张柳成", avatar: "url('images/avatar_8.png')", fallback: "👔", prop: "url('images/prop_8.png')", propFallback: "🪓" },
        { score: 12500, name: "第九阶段：黄铭金", avatar: "url('images/avatar_9.png')", fallback: "🕶️", prop: "url('images/prop_9.png')", propFallback: "💼" },
        { score: 16000, name: "第十阶段：火遮眼", avatar: "url('images/avatar_10.png')",fallback: "🔥", prop: "url('images/prop_10.png')",propFallback: "🩸" },
        { score: 20000, name: "终极形态：苗哥本人",avatar: "url('images/avatar_11.png')",fallback: "😎", prop: "url('images/prop_11.png')",propFallback: "🎬" }
    ];
    const COMBO_WORDS = ["SO COOL~", "苗友狂喜", "一路走来", "打好每一拳", "给苗哥递锤子", "中国功夫！", "真打! 真狠! 真解恨!", "打爆全球！", "hey hey！"];

    let board = [], domTiles = [], score = 0, currentStage = 0, isAnimating = false, lastSwapPos = null, globalCombo = 0;
    let props = { hammer: 5, bomb: 5, refresh: 5 }; let selectedTile = null;
    const gridContainer = document.getElementById('grid-container');
    const ghostTool = document.getElementById('ghost-tool');
    const ghostIcon = document.getElementById('ghost-tool-icon');
    const ghostInd = document.getElementById('ghost-tool-indicator');

    let activeDragTool = null;
    let currentBombRadius = 40;
    let bombRadiusTimer = null;

    // 音效系统
    const AudioCtx = window.AudioContext || window.webkitAudioContext; let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    
    function playCuteSFX(type, level = 1) {
        initAudio(); const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (type === 'select') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, t); osc.frequency.exponentialRampToValueAtTime(659.25, t + 0.08);
            gainNode.gain.setValueAtTime(0.08, t); gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            osc.start(t); osc.stop(t + 0.08);
        } else if (type === 'swap') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(350, t); osc.frequency.exponentialRampToValueAtTime(700, t + 0.12);
            gainNode.gain.setValueAtTime(0.1, t); gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            osc.start(t); osc.stop(t + 0.12);
        } else if (type === 'match') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(440, t); osc.frequency.exponentialRampToValueAtTime(880, t + 0.15);
            gainNode.gain.setValueAtTime(0.15, t); gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.start(t); osc.stop(t + 0.18);
        } else if (type === 'explode') {
            osc.type = 'square'; osc.frequency.setValueAtTime(180, t); osc.frequency.exponentialRampToValueAtTime(30, t + 0.35);
            gainNode.gain.setValueAtTime(0.25, t); gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.start(t); osc.stop(t + 0.35);
        } else if (type === 'combo') {
            osc.type = 'sine'; const freq = 500 + (level * 90);
            osc.frequency.setValueAtTime(freq, t); osc.frequency.exponentialRampToValueAtTime(freq * 1.4, t + 0.1);
            gainNode.gain.setValueAtTime(0.2, t); gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            osc.start(t); osc.stop(t + 0.15);
        }
    }

    const bgmToggle = document.getElementById('bgm-toggle'); const bgm = document.getElementById('bgm');
    bgmToggle.addEventListener('click', () => { if (bgm.paused) { bgm.play(); bgmToggle.innerText = '🎵'; bgmToggle.classList.add('bgm-playing'); } else { bgm.pause(); bgmToggle.innerText = '🔇'; bgmToggle.classList.remove('bgm-playing'); } });
    
    function showComboPopup(r, c, comboLevel) {
        if (comboLevel < 2) return;
        const word = COMBO_WORDS[Math.floor(Math.random() * COMBO_WORDS.length)];
        const span = document.createElement('div'); span.className = 'combo-text'; span.innerText = `${word} x${comboLevel}!`;
        span.style.left = `${c * TILE_SIZE + TILE_SIZE / 2}px`; span.style.top = `${r * TILE_SIZE + TILE_SIZE / 2}px`; span.style.fontSize = `${Math.min(24, 14 + comboLevel * 2)}px`;
        gridContainer.appendChild(span); setTimeout(() => span.remove(), 850); playCuteSFX('combo', comboLevel);
    }

    function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = 1; setTimeout(()=> t.style.opacity = 0, 2000); }
    
    const settingsMask = document.getElementById('settings-mask');
    document.getElementById('settings-toggle').onclick = () => { renderSaveList(); settingsMask.style.display = 'flex'; };
    function closeSettings() { settingsMask.style.display = 'none'; }
    function getSaves() { return JSON.parse(localStorage.getItem('miaoSaves') || '{}'); }
    function setSaves(saves) { localStorage.setItem('miaoSaves', JSON.stringify(saves)); }
    
    function saveGame() { let saves = getSaves(); let timeStr = new Date().toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}); saves[`存档_${timeStr}`] = { score, currentStage, props, board: board.map(r => r.map(c => ({...c}))) }; setSaves(saves); renderSaveList(); showToast('进度已保存！'); }
    function renderSaveList() {
        const container = document.getElementById('save-list-container'); container.innerHTML = '';
        Object.keys(getSaves()).reverse().forEach(key => {
            let div = document.createElement('div'); div.className = 'save-item'; div.innerText = `${key} (战力: ${getSaves()[key].score})`;
            let pressTimer; let isLongPress = false;
            const startPress = () => { isLongPress = false; pressTimer = setTimeout(() => { isLongPress = true; if(confirm(`确定删除 [${key}] 吗？`)){ let s = getSaves(); delete s[key]; setSaves(s); renderSaveList(); } }, 800); };
            const cancelPress = () => clearTimeout(pressTimer);
            div.addEventListener('touchstart', startPress, {passive: true}); div.addEventListener('touchend', () => { cancelPress(); if(!isLongPress) loadGame(key); }); div.addEventListener('touchmove', cancelPress, {passive: true});
            div.addEventListener('mousedown', startPress); div.addEventListener('mouseup', () => { cancelPress(); if(!isLongPress) loadGame(key); }); div.addEventListener('mouseleave', cancelPress);
            container.appendChild(div);
        });
        if(container.innerHTML === '') container.innerHTML = '<div style="color:#999; font-size:12px; margin-top:20px;">暂无本地存档</div>';
    }
    function loadGame(key) {
        const data = getSaves()[key]; if(!data) return;
        score = data.score; currentStage = data.currentStage; props = data.props; document.getElementById('score').innerText = score; applyEvolution(currentStage); updatePropUI();
        board = data.board; initSize(); gridContainer.innerHTML = ''; domTiles = [];
        for (let r = 0; r < ROWS; r++) { domTiles[r] = []; for (let c = 0; c < COLS; c++) { createBgCell(r, c); createTileDOM(r, c, board[r][c]); }} closeSettings(); checkDeadlock(); showToast('存档读取成功');
    }
    function autoSave() { localStorage.setItem('miaoAutoSave', JSON.stringify({ score, currentStage, props, board: board.map(r => r.map(c => ({...c}))) })); }
    function loadAutoSave() {
        const saved = localStorage.getItem('miaoAutoSave');
        if (saved) {
            const data = JSON.parse(saved); score = data.score; currentStage = data.currentStage; props = data.props; document.getElementById('score').innerText = score; applyEvolution(currentStage); updatePropUI(); board = data.board; initSize();
            for (let r = 0; r < ROWS; r++) { domTiles[r] = []; for (let c = 0; c < COLS; c++) { createBgCell(r, c); createTileDOM(r, c, board[r][c]); }} checkDeadlock(); return true;
        } return false;
    }

    function restartGame() {
        localStorage.removeItem('miaoAutoSave');
        score = 0; currentStage = 0; props = { hammer: 5, bomb: 5, refresh: 5 };
        document.getElementById('score').innerText = score;
        applyEvolution(0); updatePropUI();
        gridContainer.innerHTML = ''; domTiles = [];
        initBoard();
        closeSettings();
        showToast('已开启新一轮游戏！');
    }

    function initSize() { 
        const maxW = document.getElementById('game-wrapper').clientWidth - 8;
        const maxH = document.getElementById('game-wrapper').clientHeight - 8;
        TILE_SIZE = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
        gridContainer.style.width = `${TILE_SIZE * COLS}px`; 
        gridContainer.style.height = `${TILE_SIZE * ROWS}px`; 
    }
    function createBgCell(r, c) { const bg = document.createElement('div'); bg.className = `bg-cell ${(r + c) % 2 === 0 ? 'dark' : 'light'}`; bg.style.width = bg.style.height = `${TILE_SIZE}px`; bg.style.left = `${c * TILE_SIZE}px`; bg.style.top = `${r * TILE_SIZE}px`; gridContainer.appendChild(bg); }
    
    function initBoard() {
        initSize();
        for (let r = 0; r < ROWS; r++) { board[r] = []; domTiles[r] = []; for (let c = 0; c < COLS; c++) {
            createBgCell(r, c); let type; do { type = TYPES[Math.floor(Math.random() * TYPES.length)]; } while ((c >= 2 && board[r][c-1]?.type === type && board[r][c-2]?.type === type) || (r >= 2 && board[r-1][c]?.type === type && board[r-2][c]?.type === type));
            board[r][c] = { type, effect: 'none' }; createTileDOM(r, c, board[r][c]);
        }} autoSave();
    }
    function createTileDOM(r, c, data) {
        const tile = document.createElement('div'); tile.className = `tile ${data.effect !== 'none' ? 'effect-'+data.effect : ''}`; tile.innerText = data.type; 
        tile.style.backgroundImage = `url('images/tile_${TYPES.indexOf(data.type) + 1}.png')`;
        tile.style.width = tile.style.height = `${TILE_SIZE}px`; tile.style.top = `${r * TILE_SIZE}px`; tile.style.left = `${c * TILE_SIZE}px`;
        tile.addEventListener('click', () => handleTileClick(r, c));
        gridContainer.appendChild(tile); domTiles[r][c] = tile; return tile;
    }

    function updatePropUI() {
        document.getElementById('count-hammer').innerText = `单点 × ${props.hammer}`;
        document.getElementById('count-bomb').innerText = `炸弹 × ${props.bomb}`;
        document.getElementById('count-refresh').innerText = `刷新 × ${props.refresh}`;
        ['hammer', 'bomb', 'refresh'].forEach(p => {
            const el = document.getElementById(p === 'refresh' ? 'refresh-tool' : `${p}-tool`);
            if (props[p] <= 0) el.classList.add('disabled'); else el.classList.remove('disabled');
        });
    }

    setupToolDrag('hammer-tool', 'hammer');
    setupToolDrag('bomb-tool', 'bomb');

    document.getElementById('refresh-tool').onclick = async () => {
        if (isAnimating || props.refresh <= 0) return; props.refresh--; updatePropUI(); isAnimating = true; globalCombo = 0; playCuteSFX('explode');
        for (let r = 0; r < ROWS; r++) { for (let c = 0; c < COLS; c++) {
            let type; do { type = TYPES[Math.floor(Math.random() * TYPES.length)]; } while ((c >= 2 && board[r][c-1]?.type === type && board[r][c-2]?.type === type) || (r >= 2 && board[r-1][c]?.type === type && board[r-2][c]?.type === type));
            board[r][c] = { type, effect: 'none' }; domTiles[r][c].className = 'tile'; domTiles[r][c].innerText = type; domTiles[r][c].style.backgroundImage = `url('images/tile_${TYPES.indexOf(type) + 1}.png')`; domTiles[r][c].style.transform = 'scale(0)'; setTimeout(() => domTiles[r][c].style.transform = 'scale(1)', 50);
        }} await sleep(300); isAnimating = false; gridContainer.style.filter = 'none'; autoSave(); checkDeadlock();
    };

    function setupToolDrag(btnId, type) {
        const btn = document.getElementById(btnId);
        const startDrag = (e) => {
            if (props[type] <= 0 || isAnimating) return;
            e.preventDefault(); activeDragTool = type;
            
            ghostIcon.innerText = type === 'hammer' ? '🔨' : '💣';
            
            if (type === 'bomb') {
                currentBombRadius = TILE_SIZE * 1.5;
                let growing = true;
                bombRadiusTimer = setInterval(() => {
                    currentBombRadius += growing ? 1.5 : -1.5;
                    if (currentBombRadius > TILE_SIZE * 3) growing = false;
                    if (currentBombRadius < TILE_SIZE) growing = true;
                    ghostInd.style.width = `${currentBombRadius * 2}px`;
                    ghostInd.style.height = `${currentBombRadius * 2}px`;
                }, 30);
                ghostInd.style.borderColor = '#FF334B';
                ghostInd.style.background = 'radial-gradient(circle, rgba(255,51,75,0.3) 0%, rgba(255,51,75,0.1) 100%)';
            } else {
                ghostInd.style.width = `${TILE_SIZE}px`;
                ghostInd.style.height = `${TILE_SIZE}px`;
                ghostInd.style.borderColor = '#3CB371';
                ghostInd.style.background = 'radial-gradient(circle, rgba(60,179,113,0.3) 0%, rgba(60,179,113,0.1) 100%)';
            }

            ghostTool.style.display = 'block'; updateGhostPos(e);
            document.addEventListener('pointermove', moveDrag, { passive: false });
            document.addEventListener('pointerup', endDrag, { passive: false });
        };
        btn.addEventListener('pointerdown', startDrag);
    }

    function updateGhostPos(e) {
        const x = e.clientX !== undefined ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
        const y = e.clientY !== undefined ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
        ghostTool.style.left = `${x}px`; ghostTool.style.top = `${y}px`;
    }

    function moveDrag(e) { 
        if (activeDragTool) {
            e.preventDefault(); 
            updateGhostPos(e); 
        }
    }

    async function endDrag(e) {
        if (!activeDragTool) return;
        const toolType = activeDragTool; activeDragTool = null; ghostTool.style.display = 'none';
        if (bombRadiusTimer) { clearInterval(bombRadiusTimer); bombRadiusTimer = null; }
        document.removeEventListener('pointermove', moveDrag); document.removeEventListener('pointerup', endDrag);

        const x = e.clientX !== undefined ? e.clientX : (e.changedTouches ? e.changedTouches[0].clientX : 0);
        const y = e.clientY !== undefined ? e.clientY : (e.changedTouches ? e.changedTouches[0].clientY : 0);
        const box = gridContainer.getBoundingClientRect();

        if (x >= box.left && x <= box.right && y >= box.top && y <= box.bottom) {
            const dropX = x - box.left;
            const dropY = y - box.top;
            isAnimating = true; let toRemove = new Set();
            
            if (toolType === 'hammer') {
                const c = Math.floor(dropX / TILE_SIZE);
                const r = Math.floor(dropY / TILE_SIZE);
                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    props.hammer--; toRemove.add(`${r},${c}`); playCuteSFX('explode');
                }
            } else if (toolType === 'bomb') {
                props.bomb--;
                const activeRadius = currentBombRadius;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const tileCenterX = c * TILE_SIZE + TILE_SIZE / 2;
                        const tileCenterY = r * TILE_SIZE + TILE_SIZE / 2;
                        const dist = Math.hypot(tileCenterX - dropX, tileCenterY - dropY);
                        if (dist <= activeRadius) {
                            toRemove.add(`${r},${c}`);
                        }
                    }
                }
                playCuteSFX('explode');
            }
            updatePropUI(); await processMatches({ toRemove, newSpecials: [] });
        }
    }

    async function handleTileClick(r, c) {
        if (isAnimating) return;
        playCuteSFX('select');
        const tile = domTiles[r][c];
        
        if (!selectedTile) {
            selectedTile = { r, c, dom: tile }; tile.classList.add('selected');
        } else {
            selectedTile.dom.classList.remove('selected');
            if (Math.abs(selectedTile.r - r) + Math.abs(selectedTile.c - c) === 1) {
                isAnimating = true; globalCombo = 0; lastSwapPos = { r, c }; 
                playCuteSFX('swap');
                swapDataAndDOM(selectedTile.r, selectedTile.c, r, c); 
                await sleep(200);
                
                const matchInfo = analyzeMatches();
                if (matchInfo.toRemove.size > 0) { 
                    await processMatches(matchInfo); 
                } else { 
                    swapDataAndDOM(selectedTile.r, selectedTile.c, r, c); 
                    await sleep(200); 
                    isAnimating = false; 
                }
            }
            selectedTile = null;
        }
    }

    function swapDataAndDOM(r1, c1, r2, c2) {
        const temp = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = temp;
        const dTemp = domTiles[r1][c1]; domTiles[r1][c1] = domTiles[r2][c2]; domTiles[r2][c2] = dTemp;
        domTiles[r1][c1].style.top = `${r1 * TILE_SIZE}px`; domTiles[r1][c1].style.left = `${c1 * TILE_SIZE}px`;
        domTiles[r2][c2].style.top = `${r2 * TILE_SIZE}px`; domTiles[r2][c2].style.left = `${c2 * TILE_SIZE}px`;
        domTiles[r1][c1].onclick = null; domTiles[r2][c2].onclick = null;
        domTiles[r1][c1].addEventListener('click', () => handleTileClick(r1, c1));
        domTiles[r2][c2].addEventListener('click', () => handleTileClick(r2, c2));
    }

    function analyzeMatches() {
        let toRemove = new Set(), newSpecials = [], hLines = [], vLines = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS - 2; c++) { let len = 1; while (c+len < COLS && board[r][c]?.type === board[r][c+len]?.type && board[r][c]) len++; if (len >= 3) { let l=[]; for(let i=0;i<len;i++) l.push(`${r},${c+i}`); hLines.push({ type: board[r][c].type, cells: l, r, c, len }); c += len-1; } }
        for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS - 2; r++) { let len = 1; while (r+len < ROWS && board[r][c]?.type === board[r+len][c]?.type && board[r][c]) len++; if (len >= 3) { let l=[]; for(let i=0;i<len;i++) l.push(`${r+i},${c}`); vLines.push({ type: board[r][c].type, cells: l, r, c, len }); r += len-1; } }
        hLines.forEach(hl => { vLines.forEach(vl => { if (hl.type === vl.type) { const intersect = hl.cells.find(c => vl.cells.includes(c)); if (intersect) { let [ir, ic] = intersect.split(',').map(Number); hl.handled = vl.handled = true; hl.cells.concat(vl.cells).forEach(c => toRemove.add(c)); newSpecials.push({ r: ir, c: ic, type: hl.type, effect: 'cross' }); } } });});
        [...hLines, ...vLines].filter(l => !l.handled).forEach(l => { if (l.len >= 4) { let tp = lastSwapPos && l.cells.includes(`${lastSwapPos.r},${lastSwapPos.c}`) ? lastSwapPos : { r: l.r, c: l.c }; newSpecials.push({ r: tp.r, c: tp.c, type: l.type, effect: l.cells[0].charAt(0) === l.cells[1].charAt(0) ? 'row' : 'col' }); } l.cells.forEach(c => toRemove.add(c)); });
        return { toRemove, newSpecials };
    }

    async function triggerSpecial(r, c, effect, toRemoveSet) {
        playCuteSFX('explode');
        if (effect === 'row' || effect === 'cross') { createBlastVisual('row', r, c); for(let ic=0; ic<COLS; ic++) processBlastCell(r, ic, toRemoveSet); }
        if (effect === 'col' || effect === 'cross') { createBlastVisual('col', r, c); for(let ir=0; ir<ROWS; ir++) processBlastCell(ir, c, toRemoveSet); }
    }
    function processBlastCell(r, c, set) { const k = `${r},${c}`; if (!set.has(k) && board[r][c]) { set.add(k); if (board[r][c].effect !== 'none') triggerSpecial(r, c, board[r][c].effect, set); } }
    function createBlastVisual(dir, r, c) { const blast = document.createElement('div'); blast.className = 'blast-wave'; if(dir === 'row') { blast.style.left = '0'; blast.style.top = `${r * TILE_SIZE + TILE_SIZE/2 - 2}px`; blast.style.width = `${COLS * TILE_SIZE}px`; blast.style.height = '4px'; } else { blast.style.top = '0'; blast.style.left = `${c * TILE_SIZE + TILE_SIZE/2 - 2}px`; blast.style.height = `${ROWS * TILE_SIZE}px`; blast.style.width = '4px'; } gridContainer.appendChild(blast); setTimeout(() => blast.remove(), 300); }

    async function processMatches(matchInfo) {
        let { toRemove, newSpecials } = matchInfo;
        globalCombo++; let firstMatch = Array.from(toRemove)[0];
        if (firstMatch) { let [fr, fc] = firstMatch.split(',').map(Number); showComboPopup(fr, fc, globalCombo); } else { playCuteSFX('match'); }

        toRemove.forEach(str => { let [r, c] = str.split(',').map(Number); if (board[r][c] && board[r][c].effect !== 'none') triggerSpecial(r, c, board[r][c].effect, toRemove); });
        toRemove.forEach(str => { let [r, c] = str.split(',').map(Number); if (domTiles[r][c]) { domTiles[r][c].classList.add('matched'); board[r][c] = null; } });
        
        score += toRemove.size * 10; document.getElementById('score').innerText = score;
        if (currentStage < EVOLUTION.length - 1 && score >= EVOLUTION[currentStage + 1].score) {
            applyEvolution(currentStage + 1); props.hammer+=2; props.bomb+=2; props.refresh+=2; updatePropUI(); showToast('突破形态！道具全 +2');
        }
        await sleep(250);
        toRemove.forEach(str => { let [r, c] = str.split(',').map(Number); if (domTiles[r][c]) { domTiles[r][c].remove(); domTiles[r][c] = null; } });
        newSpecials.forEach(sp => { board[sp.r][sp.c] = { type: sp.type, effect: sp.effect }; createTileDOM(sp.r, sp.c, board[sp.r][sp.c]); });
        
        await applyGravity(); lastSwapPos = null; const nextInfo = analyzeMatches();
        if (nextInfo.toRemove.size > 0) { await processMatches(nextInfo); } else { autoSave(); checkDeadlock(); isAnimating = false; }
    }

    async function applyGravity() {
        for (let c = 0; c < COLS; c++) {
            let empty = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!board[r][c]) empty++;
                else if (empty > 0) {
                    board[r + empty][c] = board[r][c]; domTiles[r + empty][c] = domTiles[r][c]; board[r][c] = null; domTiles[r][c] = null;
                    domTiles[r + empty][c].style.top = `${(r + empty) * TILE_SIZE}px`; let nr = r + empty; domTiles[nr][c].onclick = null; domTiles[nr][c].addEventListener('click', () => handleTileClick(nr, c));
                }
            }
            for (let i = 0; i < empty; i++) {
                const type = TYPES[Math.floor(Math.random() * TYPES.length)]; board[i][c] = { type, effect: 'none' };
                const nTile = createTileDOM(i, c, board[i][c]); nTile.style.top = `${(i - empty) * TILE_SIZE}px`; nTile.offsetHeight; nTile.style.top = `${i * TILE_SIZE}px`;
            }
        }
        await sleep(250);
    }

    function applyEvolution(stageIdx) {
        currentStage = stageIdx; const av = document.getElementById('character-avatar'); av.style.transform = "scale(1.3) translateY(-10px)";
        setTimeout(() => {
            av.style.backgroundImage = EVOLUTION[currentStage].avatar; av.innerText = EVOLUTION[currentStage].fallback;
            const prop = document.getElementById('desk-prop'); prop.style.backgroundImage = EVOLUTION[currentStage].prop; prop.innerText = EVOLUTION[currentStage].propFallback;
            av.style.transform = "scale(1) translateY(0)";
        }, 150);
    }

    function checkDeadlock() {
        let hasMove = false;
        const checkSwap = (r1, c1, r2, c2) => { const temp = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = temp; const match = analyzeMatches().toRemove.size > 0; board[r2][c2] = board[r1][c1]; board[r1][c1] = temp; return match; };
        for (let r = 0; r < ROWS && !hasMove; r++) { for (let c = 0; c < COLS && !hasMove; c++) { if (c < COLS - 1) if (checkSwap(r, c, r, c + 1)) hasMove = true; if (r < ROWS - 1) if (checkSwap(r, c, r + 1, c)) hasMove = true; } }
        if (!hasMove) {
            if (props.refresh > 0) { gridContainer.style.filter = 'grayscale(80%) brightness(0.6)'; showToast('陷入僵局，请使用刷新道具！'); } 
            else { showToast('死局！游戏结束！'); setTimeout(() => generatePoster(), 1500); }
        } else { gridContainer.style.filter = 'none'; }
    }

    document.getElementById('camera-toggle').onclick = () => generatePoster();
    function generatePoster() {
        document.getElementById('poster-mask').style.display = 'flex'; document.getElementById('poster-score').innerText = score; document.getElementById('poster-role-text').innerText = `已解锁：${EVOLUTION[currentStage].name}`;
        const prev = document.getElementById('poster-avatar-preview'); prev.style.backgroundImage = EVOLUTION[currentStage].avatar; prev.innerText = EVOLUTION[currentStage].fallback;
        document.getElementById('capture-area').style.display = 'flex'; document.getElementById('final-poster-img').style.display = 'none'; document.getElementById('save-tip-text').innerText = "正在生成海报...";
        setTimeout(() => {
            html2canvas(document.getElementById('capture-area'), { scale: 3, backgroundColor: "#FFF5E1", useCORS: true }).then(canvas => {
                document.getElementById('final-poster-img').src = canvas.toDataURL('image/png'); document.getElementById('capture-area').style.display = 'none'; document.getElementById('final-poster-img').style.display = 'block'; document.getElementById('save-tip-text').innerText = "👇 长按上方图片即可保存到相册 👇";
            });
        }, 500);
    }
    function closePoster() { document.getElementById('poster-mask').style.display = 'none'; if(props.refresh <= 0) { localStorage.removeItem('miaoAutoSave'); location.reload(); } }

    if (!loadAutoSave()) { initBoard(); updatePropUI(); applyEvolution(0); }
</script>
</body>
</html>
